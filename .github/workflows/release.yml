name: Build and publish Windows release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: storylab-release-electron-updater
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install icon-generation dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Validate app source
        run: npm run test:static

      - name: Build and publish installer with electron-updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish:win

      - name: Verify published release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $release = gh release view $tag --json assets | ConvertFrom-Json
          $names = @($release.assets | ForEach-Object { $_.name })
          if ($names -notcontains "$version.exe") { throw "Missing installer: $version.exe" }
          if ($names -notcontains "latest.yml") { throw "Missing electron-updater metadata: latest.yml" }
          if ($names -notcontains "$version.exe.blockmap") { Write-Host "Blockmap not present; full installer updates will still be available." }
          Write-Host "Verified release assets: $($names -join ', ')"
