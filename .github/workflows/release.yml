name: Build and publish Windows release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build and publish installer with updater metadata
        run: npm run publish:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep installer and metadata required by auto-update
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $keep = @("$version.exe", "latest.yml")
          $assets = gh release view $tag --json assets | ConvertFrom-Json
          foreach ($asset in $assets.assets) {
            if ($asset.name -notin $keep) {
              gh release delete-asset $tag $asset.name --yes
            }
          }
          $finalAssets = gh release view $tag --json assets | ConvertFrom-Json
          $names = @($finalAssets.assets | ForEach-Object { $_.name } | Sort-Object)
          $expected = @($keep | Sort-Object)
          if ($names.Count -ne 2 -or (Compare-Object $names $expected)) {
            throw "Release must contain $version.exe and latest.yml for electron-updater"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
