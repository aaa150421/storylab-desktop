name: Build and publish Windows release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build and publish installer
        run: npm run publish:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep only the versioned EXE in the GitHub release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $keep = "$version.exe"
          $assets = gh release view $tag --json assets | ConvertFrom-Json
          foreach ($asset in $assets.assets) {
            if ($asset.name -ne $keep) {
              gh release delete-asset $tag $asset.name --yes
            }
          }
          $finalAssets = gh release view $tag --json assets | ConvertFrom-Json
          if ($finalAssets.assets.Count -ne 1 -or $finalAssets.assets[0].name -ne $keep) {
            throw "Release must contain only $keep"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
