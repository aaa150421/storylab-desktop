name: Build and publish Windows release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build and publish installer
        run: npm run publish:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the updater metadata and remove only the blockmap
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $asset = "storylab-desktop-setup-$version.exe.blockmap"
          $assets = gh release view $tag --json assets | ConvertFrom-Json
          if ($assets.assets.name -contains $asset) {
            gh release delete-asset $tag $asset --yes
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
