name: Validate app source

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report detailed npm audit findings
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/npm-audit.json","utf8"));const entries=Object.entries(r.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:(v.via||[]).map(x=>typeof x==="string"?x:{title:x.title,url:x.url,range:x.range})}));console.log(JSON.stringify({counts:r.metadata?.vulnerabilities,entries},null,2));'
      - name: Validate app source
        run: npm run test:static
