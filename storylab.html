<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>이야기공방</title>
<style>
:root{color-scheme:light;--bg:#f8f7fb;--paper:#fff;--ink:#292538;--muted:#89839a;--line:#ebe7f3;--lav:#eee8fb;--purple:#8b6bd1;--deep:#7050b7;--shadow:0 8px 28px #34205c0b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font:14px/1.5 "Segoe UI","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #b6a0ed;outline-offset:2px}.app{height:100%;display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr);gap:0}.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 26px;background:var(--paper);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:750;letter-spacing:-.5px;min-width:190px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#c7b4f4,#8465ca);display:grid;place-items:center;color:#fff;font-size:18px;box-shadow:0 4px 12px #9274d52b}.top-search{max-width:480px;flex:1;position:relative}.top-search input{width:100%;border:1px solid var(--line);background:#faf9fd;border-radius:10px;padding:10px 14px 10px 38px;color:var(--ink)}.search-icon{position:absolute;left:13px;top:9px;color:#a19aaf}.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;color:#5e566f;font-weight:600;transition:.15s}.btn:hover{border-color:#cbb9f1;background:#faf7ff}.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}.btn.primary:hover{background:var(--deep)}.btn.soft{background:var(--lav);border-color:var(--lav);color:var(--deep)}.sidebar{background:#fff;border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:6px;min-height:0}.side-label{font-size:10px;letter-spacing:1.2px;font-weight:800;color:#aaa3b7;padding:0 12px;margin:12px 0 5px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#777087;display:flex;align-items:center;gap:12px;font-weight:600}.nav .ico{width:19px;text-align:center;font-size:16px}.nav:hover{background:#faf8fe;color:var(--deep)}.nav.active{background:var(--lav);color:var(--deep)}.side-bottom{margin-top:auto;border:1px solid var(--line);background:#fcfbfe;border-radius:12px;padding:14px}.side-bottom strong{font-size:12px}.side-bottom p{font-size:11px;color:var(--muted);margin:5px 0 12px}.main{min-width:0;min-height:0;overflow:auto;padding:28px clamp(20px,3vw,46px) 42px}.content{max-width:1250px;margin:0 auto}.eyebrow{font-size:11px;color:var(--purple);font-weight:800;letter-spacing:1.2px;margin-bottom:7px}.page-head{display:flex;align-items:flex-end;gap:20px;margin-bottom:26px}.page-head h1{font-size:27px;letter-spacing:-1px;margin:0;font-weight:750}.page-head p{margin:6px 0 0;color:var(--muted);font-size:13px}.head-right{margin-left:auto;display:flex;gap:8px}.hero{border:1px solid #e9e0fa;border-radius:18px;background:linear-gradient(115deg,#f2ecff 0%,#fbf9ff 60%,#fff 100%);padding:25px 28px;display:flex;align-items:center;gap:22px;margin-bottom:24px;overflow:hidden;position:relative}.hero:after{content:"✧";font-size:118px;color:#d9cbf6;position:absolute;right:36px;top:-20px;opacity:.7}.hero-copy{position:relative;z-index:1}.hero h2{font-size:20px;margin:0 0 7px;letter-spacing:-.5px}.hero p{margin:0;color:#7c718f;font-size:13px}.hero .btn{margin-top:16px}.hero-stat{margin-left:auto;margin-right:105px;position:relative;z-index:1;text-align:center;min-width:100px}.hero-stat strong{display:block;font-size:30px;color:var(--deep)}.hero-stat span{font-size:11px;color:#8b819b}.section-head{display:flex;align-items:center;gap:12px;margin:26px 0 14px}.section-head h2{font-size:16px;margin:0;letter-spacing:-.3px}.section-head span{font-size:12px;color:var(--muted)}.section-head .btn{margin-left:auto;padding:7px 11px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:24px}.stat-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px 19px;box-shadow:var(--shadow)}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{width:32px;height:32px;border-radius:10px;background:#f1ebfc;color:var(--deep);display:grid;place-items:center;font-size:15px}.stat-card strong{font-size:25px;display:block;margin-top:10px;letter-spacing:-.7px}.stat-card small{color:#9a93a7;font-size:11px}.work-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.work-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}.work-card:hover{transform:translateY(-2px);border-color:#d7c8f2}.cover{height:94px;border-radius:10px;background:linear-gradient(135deg,#eee6fc,#faf8ff);display:flex;align-items:center;justify-content:center;font-size:29px;color:#9c80db;margin-bottom:15px}.cover.c2{background:linear-gradient(135deg,#fbeef3,#fff8fb);color:#d28ba7}.cover.c3{background:linear-gradient(135deg,#eaf3f2,#f8fcfb);color:#77a9a2}.work-title{font-size:15px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.work-desc{color:var(--muted);font-size:12px;min-height:36px;margin:6px 0 14px;overflow:hidden}.work-meta{border-top:1px solid #f0edf5;padding-top:12px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#9a93a7}.tag{border-radius:6px;background:#f2ecfc;color:#8063bd;padding:3px 7px;font-size:10px;font-weight:700}.empty{border:1px dashed #d9d0e8;border-radius:14px;padding:36px;text-align:center;color:var(--muted);background:#fff}.editor-layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}.editor-card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}.field label{font-size:12px;color:#81788f;font-weight:700}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:#fdfcff;color:var(--ink)}.field textarea{min-height:45vh;resize:vertical;line-height:1.9;font-family:Georgia,"Batang",serif;font-size:16px}.editor-tools{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:15px}.save-msg{margin-left:auto;font-size:11px;color:#938ba0}.panel h3{margin:0 0 15px;font-size:14px}.panel p{font-size:12px;color:var(--muted);line-height:1.7}.file-actions{display:grid;gap:9px}.file-actions .btn{text-align:center}.settings-row{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}.settings-row:last-child{border-bottom:0}.settings-row strong{display:block;font-size:13px}.settings-row p{margin:4px 0 0;color:var(--muted);font-size:12px}.settings-row .btn{margin-left:auto;white-space:nowrap}.toast{position:fixed;bottom:22px;right:24px;padding:12px 16px;border-radius:10px;background:#33294a;color:#fff;box-shadow:0 8px 30px #241b382e;z-index:5}.hidden{display:none!important}
@media(max-width:1000px){.app{grid-template-columns:180px minmax(0,1fr)}.work-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-stat{margin-right:65px}.editor-layout{grid-template-columns:1fr}.editor-layout .panel{order:-1}}@media(max-width:700px){.app{grid-template-columns:62px minmax(0,1fr);grid-template-rows:58px minmax(0,1fr)}.top{padding:0 12px;gap:10px}.brand{min-width:0;font-size:0}.logo{flex:none}.top-search{max-width:none}.top-actions .btn:not(.primary){display:none}.sidebar{padding:18px 7px}.side-label,.nav .nav-text,.side-bottom{display:none}.nav{justify-content:center;padding:12px 0}.nav .ico{font-size:18px}.main{padding:20px 13px}.page-head{align-items:flex-start;flex-wrap:wrap}.page-head h1{font-size:23px}.head-right{width:100%;margin:0}.hero{padding:20px}.hero-stat{display:none}.hero:after{right:12px}.stats{grid-template-columns:1fr}.work-grid{grid-template-columns:1fr}.cover{height:75px}.editor-tools{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brand"><div class="logo">✦</div><span>이야기공방</span></div>
 <div class="top-search"><span class="search-icon">⌕</span><input id="search" placeholder="작품이나 원고 검색..." aria-label="작품 검색"></div>
 <div class="top-actions"><button class="btn" id="importTop">↑ 백업 불러오기</button><button class="btn primary" id="exportTop">↓ 백업 저장</button></div>
</header>
<aside class="sidebar">
 <div class="side-label">WORKSPACE</div>
 <button class="nav active" data-page="home"><span class="ico">⌂</span><span class="nav-text">홈 대시보드</span></button>
 <button class="nav" data-page="works"><span class="ico">▤</span><span class="nav-text">내 작품</span></button>
 <button class="nav" data-page="editor"><span class="ico">✎</span><span class="nav-text">원고 편집</span></button>
 <div class="side-label">MANAGE</div>
 <button class="nav" data-page="backup"><span class="ico">↥</span><span class="nav-text">백업 및 복원</span></button>
 <button class="nav" data-page="settings"><span class="ico">⚙</span><span class="nav-text">설정</span></button>
 <div class="side-bottom"><strong>작업은 안전하게</strong><p>원고 파일을 주기적으로 백업해 두세요.</p><button class="btn soft" style="width:100%" data-page="backup">백업 관리</button></div>
</aside>
<main class="main"><div class="content" id="view"></div></main>
</div>
<input type="file" id="fileInput" accept=".json,application/json" class="hidden">
<div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';
const KEY='storylab.fresh.workspace.v1',BACKUP_APP='storylab';
let state={app:BACKUP_APP,version:1,works:[],activeId:null,lastBackup:null};
let currentPage='home',toastTimer=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.works))state=x;}catch(e){} if(!state.works.length)state.works=[{id:id(),title:'새로운 이야기',description:'이야기의 첫 장면을 시작해 보세요.',body:'',updatedAt:Date.now()}];if(!state.activeId||!state.works.some(w=>w.id===state.activeId))state.activeId=state.works[0].id;save(false);}
function id(){return 'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function save(show=true){try{localStorage.setItem(KEY,JSON.stringify(state));if(show)$('#saveMsg')&&($('#saveMsg').textContent='저장됨');}catch(e){notify('저장 공간이 부족해요. 먼저 백업해 주세요.');}}
function active(){return state.works.find(w=>w.id===state.activeId)||state.works[0]}
function manuscriptBody(w){if(!w)return '';if(typeof w.body==='string'&&w.body)return w.body;if(typeof w.content==='string')return w.content;if(Array.isArray(w.chapters)){const c=w.chapters.find(ch=>String(ch.id)===String(w.cur))||w.chapters[0];return c&&typeof c.body==='string'?c.body:'';}return '';}
function fmt(t){return new Date(t||Date.now()).toLocaleDateString('ko-KR',{year:'numeric',month:'short',day:'numeric'})}
function notify(s){const t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2600)}
function header(eyebrow,title,desc,actions=''){return '<div class="page-head"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1><p>'+desc+'</p></div><div class="head-right">'+actions+'</div></div>'}
function workCard(w,i){return '<article class="work-card" data-open="'+esc(w.id)+'"><div class="cover '+(['','c2','c3'][i%3])+'">'+(['✧','❋','❖'][i%3])+'</div><div class="work-title">'+esc(w.title||w.name||'제목 없는 작품')+'</div><div class="work-desc">'+esc(w.description||w.summary||'아직 작품 설명이 없어요.')+'</div><div class="work-meta"><span>'+fmt(w.updatedAt)+'</span><span class="tag">집필 중</span></div></article>'}
function renderHome(){const total=state.works.length,words=state.works.reduce((n,w)=>n+(w.body||'').replace(/\s/g,'').length,0);return header('YOUR CREATIVE SPACE','작가의 작업실','오늘도 당신의 이야기를 차근차근 만들어 보세요.','<button class="btn primary" id="newWork">＋ 새 작품</button>')+'<section class="hero"><div class="hero-copy"><div class="eyebrow">A LITTLE STORY, EVERY DAY</div><h2>당신의 다음 이야기가 기다리고 있어요.</h2><p>생각을 정리하고, 장면을 쓰고, 이야기의 세계를 만들어 보세요.</p><button class="btn soft" data-page="editor">집필 이어가기&nbsp; →</button></div><div class="hero-stat"><strong>'+total+'</strong><span>내 작품</span></div></section><div class="stats"><div class="stat-card"><div class="stat-top">전체 작품 <span class="stat-icon">▤</span></div><strong>'+total+'</strong><small>작업 중인 이야기</small></div><div class="stat-card"><div class="stat-top">작성한 글자 수 <span class="stat-icon">✎</span></div><strong>'+words.toLocaleString()+'</strong><small>공백 제외 기준</small></div><div class="stat-card"><div class="stat-top">마지막 작업 <span class="stat-icon">◷</span></div><strong style="font-size:18px;margin-top:15px">'+(active()?fmt(active().updatedAt):'—')+'</strong><small>최근 수정 날짜</small></div></div><div class="section-head"><h2>최근 작업</h2><span>최근 수정한 작품을 이어서 작업하세요</span><button class="btn" data-page="works">전체 작품 보기 →</button></div><div class="work-grid">'+state.works.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,3).map(workCard).join('')+'</div>'}
function renderWorks(){const q=$('#search').value.trim().toLowerCase(),list=state.works.filter(w=>(w.title+' '+(w.description||'')).toLowerCase().includes(q));return header('MY LIBRARY','내 작품','작품을 만들고, 정리하고, 다시 이어서 집필하세요.','<button class="btn primary" id="newWork">＋ 새 작품</button>')+(list.length?'<div class="work-grid">'+list.map(workCard).join('')+'</div>':'<div class="empty">검색 결과가 없어요.</div>')}
function renderEditor(){const w=active();if(!w)return renderWorks();return header('WRITING DESK','원고 편집','생각의 흐름을 끊지 않고 이야기를 써 내려가세요.','<button class="btn" data-page="works">← 작품 목록</button><button class="btn primary" id="newWork">＋ 새 작품</button>')+'<div class="editor-layout"><section class="editor-card"><div class="field"><label for="title">작품 제목</label><input id="title" value="'+esc(w.title||w.name||'')+'" placeholder="작품 제목을 입력하세요"></div><div class="field"><label for="description">한 줄 소개</label><input id="description" value="'+esc(w.description||w.summary||'')+'" placeholder="이야기를 한 줄로 소개해 보세요"></div><div class="field"><label for="body">원고</label><textarea id="body" placeholder="이곳에서 이야기를 시작하세요...">'+esc(manuscriptBody(w))+'</textarea></div><div class="editor-tools"><button class="btn" id="deleteWork">작품 삭제</button><button class="btn primary" id="saveWork">저장</button><span class="save-msg" id="saveMsg">자동 저장 사용 중</span></div></section><aside class="panel"><h3>작업 정보</h3><p>이 작품은 이 컴퓨터에 자동 저장됩니다. 중요한 원고는 백업 파일로 따로 보관해 주세요.</p><div class="settings-row"><div><strong>마지막 수정</strong><p>'+fmt(w.updatedAt)+'</p></div></div><div class="settings-row"><div><strong>글자 수</strong><p id="wordCount">'+(w.body||'').replace(/\s/g,'').length+'자 (공백 제외)</p></div></div><div class="file-actions" style="margin-top:16px"><button class="btn soft" id="exportTop2">↓ 백업 저장</button><button class="btn" id="importTop2">↑ 백업 불러오기</button></div></aside></div>'}
function renderBackup(){return header('BACKUP & RESTORE','백업 및 복원','작품을 파일로 내보내고, 저장해 둔 백업을 다시 불러올 수 있어요.')+'<section class="editor-card"><div class="settings-row"><div><strong>백업 파일 저장</strong><p>현재 작품 전체를 JSON 파일로 다운로드합니다.</p></div><button class="btn primary" id="exportBtn">↓ 백업 저장</button></div><div class="settings-row"><div><strong>백업 파일 불러오기</strong><p>이야기공방 JSON 백업을 선택해 작품을 복원합니다.</p></div><button class="btn" id="importBtn">↑ 파일 선택</button></div><p style="margin-top:20px">마지막 백업: '+(state.lastBackup?fmt(state.lastBackup):'아직 백업하지 않았어요')+'</p></section>'}
function renderSettings(){return header('PREFERENCES','설정','이야기공방의 기본 설정과 데이터 관리')+'<section class="editor-card"><div class="settings-row"><div><strong>자동 저장</strong><p>작품 편집 내용은 이 컴퓨터의 로컬 저장소에 자동 저장됩니다.</p></div><span class="tag">켜짐</span></div><div class="settings-row"><div><strong>백업 및 복원</strong><p>작품을 JSON 파일로 저장하거나 기존 백업을 불러옵니다.</p></div><button class="btn" data-page="backup">관리하기 →</button></div></section>'}
function render(){const view=$('#view');view.innerHTML=currentPage==='home'?renderHome():currentPage==='works'?renderWorks():currentPage==='editor'?renderEditor():currentPage==='backup'?renderBackup():renderSettings();document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));bindView();}
function go(p){currentPage=p;render()}
function newWork(){const w={id:id(),title:'새로운 이야기',description:'',body:'',updatedAt:Date.now()};state.works.unshift(w);state.activeId=w.id;save(false);go('editor');$('#title')?.focus();$('#title')?.select();}
function bindView(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-open]').forEach(c=>c.onclick=()=>{state.activeId=c.dataset.open;save(false);go('editor')});$('#newWork')?.addEventListener('click',newWork);$('#saveWork')?.addEventListener('click',()=>{syncEditor();save();notify('작품을 저장했어요.')});$('#deleteWork')?.addEventListener('click',()=>{const w=active();if(!w)return;if(!confirm('이 작품을 삭제할까요?'))return;state.works=state.works.filter(x=>x.id!==w.id);if(!state.works.length)state.works.push({id:id(),title:'새로운 이야기',description:'',body:'',updatedAt:Date.now()});state.activeId=state.works[0].id;save(false);go('works');notify('작품을 삭제했어요.')});['title','description','body'].forEach(k=>$('#'+k)?.addEventListener('input',()=>{syncEditor();save(false);if(k==='body')$('#wordCount').textContent=($('#body').value||'').replace(/\s/g,'').length+'자 (공백 제외)';}));$('#exportBtn')?.addEventListener('click',exportBackup);$('#importBtn')?.addEventListener('click',()=>$('#fileInput').click());$('#exportTop2')?.addEventListener('click',exportBackup);$('#importTop2')?.addEventListener('click',()=>$('#fileInput').click());}
function syncEditor(){const w=active();if(!w)return;w.title=$('#title')?.value||w.name||'제목 없는 작품';w.description=$('#description')?.value||'';w.body=$('#body')?.value||'';if(Array.isArray(w.chapters)&&w.chapters.length){const c=w.chapters.find(ch=>String(ch.id)===String(w.cur))||w.chapters[0];if(c)c.body=w.body;}w.updatedAt=Date.now();}
function exportBackup(){if(currentPage==='editor')syncEditor();const payload={app:BACKUP_APP,version:1,exportedAt:new Date().toISOString(),works:state.works.map(w=>({...w})),state:{...state,works:state.works.map(w=>({...w}))}};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='이야기공방-백업-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);state.lastBackup=Date.now();save(false);notify('백업 파일을 저장했어요.');}
function importBackup(file){if(!file)return;const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);let works=Array.isArray(o)?o:(o&&o.app===BACKUP_APP&&Array.isArray(o.works)?o.works:(o&&o.state&&Array.isArray(o.state.works)?o.state.works:null));if(!works)throw Error('invalid');if(!confirm('백업 파일의 작품을 불러올까요? 같은 ID의 작품은 백업 내용으로 바뀝니다.'))return;const map=new Map(state.works.map(w=>[w.id,w]));works.forEach((w,i)=>{if(!w||typeof w!=='object')return;const idv=w.id||id();map.set(idv,{...w,id:idv,title:String(w.title||'제목 없는 작품'),description:String(w.description||''),body:String(w.body||w.content||''),updatedAt:Number(w.updatedAt)||Date.now()})});state.works=Array.from(map.values());if(!state.works.length)throw Error('empty');state.activeId=state.works[0].id;save(false);go('works');notify('백업을 불러왔어요.');}catch(e){notify('이야기공방 백업 파일을 확인해 주세요.');}finally{$('#fileInput').value=''}};fr.readAsText(file,'utf-8')}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));$('#exportTop').addEventListener('click',exportBackup);$('#importTop').addEventListener('click',()=>$('#fileInput').click());$('#fileInput').addEventListener('change',e=>importBackup(e.target.files[0]));$('#search').addEventListener('input',()=>{if(currentPage==='works')render()});load();render();
})();
</script>
</body></html>
