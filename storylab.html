<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이야기공방</title>
<style>
:root{color-scheme:light;--bg:#fff;--paper:#fff;--soft:#faf9fc;--soft2:#f5f1fb;--ink:#302b3b;--muted:#8c8598;--line:#eae6f0;--lav:#eee8fa;--purple:#8768c8;--deep:#7050b3;--rail:204px;--right:226px;--top:40px;--tabs:32px}
*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden}body{font:12px/1.45 "Segoe UI","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #b8a3e6;outline-offset:1px}
.app{height:100%;display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--right);grid-template-rows:var(--top) var(--tabs) minmax(0,1fr)}
.top{grid-column:1/-1;display:flex;align-items:center;padding:0 12px;gap:12px;border-bottom:1px solid var(--line);background:#fff}.brand{display:flex;align-items:center;gap:8px;width:178px;flex-shrink:0;font-weight:750;font-size:13px;letter-spacing:-.3px}.logo{width:23px;height:23px;border-radius:7px;background:linear-gradient(145deg,#c7b5ef,#8060c5);color:#fff;display:grid;place-items:center;font-size:13px}.crumb{color:var(--muted);white-space:nowrap}.crumb b{color:var(--ink);font-weight:600}.top-actions{margin-left:auto;display:flex;align-items:center;gap:5px}.icon-btn,.mini-btn{border:1px solid transparent;background:transparent;border-radius:5px;padding:4px 7px;color:#777084}.icon-btn:hover,.mini-btn:hover{background:var(--soft2);color:var(--deep)}.btn{border:1px solid var(--line);background:#fff;border-radius:5px;padding:5px 8px;font-size:11px;color:#635b70}.btn:hover{border-color:#d4c5ee;background:#fbf9ff}.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}.btn.primary:hover{background:var(--deep)}.tabs{grid-column:1/-1;display:flex;align-items:stretch;gap:2px;padding:3px 7px 0;background:#faf9fc;border-bottom:1px solid var(--line);overflow-x:auto}.tab{display:flex;align-items:center;gap:8px;min-width:92px;max-width:180px;padding:0 10px;border:1px solid transparent;border-bottom:0;border-radius:5px 5px 0 0;color:#827b90;white-space:nowrap;cursor:pointer}.tab.active{background:#fff;border-color:var(--line);color:var(--deep)}.tab .close{color:#a39baa;font-size:13px}.tab-plus{padding:3px 8px;color:#958ca4;border:0;background:transparent}
.left{grid-column:1;grid-row:3;min-height:0;overflow:auto;border-right:1px solid var(--line);padding:11px 8px;background:#fff}.side-head{display:flex;align-items:center;justify-content:space-between;padding:3px 7px 8px;color:#8d859b;font-size:10px;font-weight:700;letter-spacing:.4px}.side-head button{font-size:15px;color:var(--purple);border:0;background:transparent}.search{width:100%;height:27px;border:1px solid var(--line);background:var(--soft);border-radius:5px;padding:0 8px;margin-bottom:11px;font-size:11px}.tree-label{font-size:10px;color:#a19aaa;padding:9px 7px 4px}.tree-row{display:flex;align-items:center;gap:7px;min-height:27px;padding:4px 7px;border-radius:5px;color:#6f687d;cursor:pointer;min-width:0}.tree-row:hover{background:#faf8fd}.tree-row.active{background:var(--lav);color:var(--deep);font-weight:600}.tree-row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.tree-row .dot{color:#b5a2e0}.subtree{padding-left:13px}.left-bottom{border-top:1px solid var(--line);margin-top:15px;padding:10px 7px;display:flex;gap:6px;flex-wrap:wrap}.left-bottom .btn{font-size:10px}
.center{grid-column:2;grid-row:3;min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff;position:relative}.editor-head{height:38px;min-height:38px;display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid #f0edf4}.editor-title{font-size:12px;font-weight:700;border:0;outline:0;min-width:0;width:210px;background:transparent}.editor-title:focus{box-shadow:inset 0 -1px var(--purple)}.divider{height:15px;width:1px;background:var(--line);margin:0 2px}.editor-head .spacer{flex:1}.save-status{font-size:10px;color:#9a93a4;white-space:nowrap}.write-area{flex:1;min-height:0;overflow:auto;padding:26px 20px 42px;background:#fff}.paper{max-width:700px;margin:0 auto;min-height:100%;}.chapter-kicker{font-size:10px;letter-spacing:1px;color:#a79cb9;margin:0 0 10px}.chapter-title{font:600 23px/1.45 "Noto Serif KR","Batang",serif;letter-spacing:-.6px;width:100%;border:0;outline:0;background:transparent;margin:0 0 20px;padding:0;color:#342d40}.chapter-title:focus{box-shadow:inset 0 -1px #d7c7f2}.body-edit{display:block;width:100%;min-height:calc(100vh - 235px);resize:none;border:0;outline:0;background:transparent;color:#494253;font:14px/2 "Noto Serif KR","Batang",serif;letter-spacing:.02px;padding:0}.body-edit::placeholder{color:#c1bbc9}.editor-foot{height:27px;min-height:27px;border-top:1px solid #f0edf4;display:flex;align-items:center;gap:12px;padding:0 12px;color:#9a93a4;font-size:10px}.editor-foot .spacer{flex:1}
.right{grid-column:3;grid-row:3;min-width:0;min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--line);background:#fff}.ref-head{height:38px;min-height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);font-weight:700;font-size:11px}.ref-tabs{display:flex;gap:1px;padding:6px 8px 0;border-bottom:1px solid var(--line)}.ref-tab{border:0;background:transparent;padding:6px 8px;color:#8e8799;font-size:10px;border-bottom:2px solid transparent}.ref-tab.active{color:var(--deep);border-bottom-color:var(--purple);font-weight:700}.ref-content{overflow:auto;padding:12px;flex:1;min-height:0}.ref-search{width:100%;border:1px solid var(--line);border-radius:5px;padding:6px 8px;margin-bottom:10px;background:var(--soft)}.ref-item{border:1px solid var(--line);border-radius:6px;padding:9px;margin-bottom:7px}.ref-item strong{font-size:11px;display:block;margin-bottom:4px}.ref-item p{font-size:10px;line-height:1.6;color:#8b8497;margin:0;white-space:pre-wrap}.ref-item button{float:right;border:0;background:transparent;color:#9e94ae}.ref-add{width:100%;border:1px dashed #d9cdec;background:#fcfaff;color:var(--deep);border-radius:5px;padding:7px;font-size:10px}.ref-editor{width:100%;min-height:65px;resize:vertical;border:1px solid var(--line);border-radius:5px;padding:7px;margin-bottom:8px}.outline-row{padding:7px 5px;border-bottom:1px solid #f2eff6;font-size:11px;color:#776f84;cursor:pointer}.outline-row:hover{color:var(--deep);background:#fbf9fe}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0;flex:1}.split .pane{display:flex;flex-direction:column;min-width:0;min-height:0}.split .pane+.pane{border-left:1px solid var(--line)}.split .write-area{padding:21px 16px}.split .chapter-title{font-size:19px}.split .body-edit{font-size:13px;line-height:1.85}.split .editor-title{width:140px}.split .save-status{display:none}
.focus .app{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1fr)}.focus .top{grid-column:1;grid-row:1}.focus .brand{width:auto}.focus .tabs,.focus .left,.focus .right{display:none}.focus .center{grid-column:1;grid-row:2;max-width:920px;width:100%;margin:0 auto;border:0}.focus .editor-head{padding:0 18px}.focus .write-area{padding:45px 42px}.focus .body-edit{min-height:calc(100vh - 230px);font-size:15px;line-height:2.15}.focus .chapter-title{font-size:27px}.focus .editor-foot{padding:0 18px}
.toast{position:fixed;bottom:35px;left:50%;transform:translateX(-50%);background:#30263f;color:#fff;padding:8px 13px;border-radius:6px;box-shadow:0 5px 18px #24172c20;z-index:30}.hidden{display:none!important}
@media(max-width:980px){:root{--rail:175px;--right:195px}.brand{width:150px}.crumb{display:none}.write-area{padding:22px 15px}.editor-title{width:145px}}@media(max-width:720px){:root{--rail:45px;--right:0px}.app{grid-template-columns:var(--rail) minmax(0,1fr)}.left{padding:8px 4px}.side-head,.search,.tree-label,.tree-row .name,.tree-row .dot,.subtree,.left-bottom{display:none}.tree-row{justify-content:center;padding:7px 0}.center{grid-column:2}.right{display:none}.brand{width:auto}.top{gap:7px}.logo{flex-shrink:0}.top-actions .btn{padding:4px 5px}.save-status{display:none}.editor-title{width:125px}.split .pane+.pane{display:none}}
</style></head><body><div class="app" id="app">
<header class="top"><div class="brand"><span class="logo">✦</span><span>이야기공방</span></div><span class="crumb">작품 / <b id="crumbTitle">새로운 이야기</b></span><div class="top-actions"><button class="icon-btn" id="importTop" title="백업 불러오기">↑ 불러오기</button><button class="btn" id="exportTop">↓ 백업 저장</button><button class="icon-btn" id="splitBtn" title="좌우 분할">▥ 분할</button><button class="icon-btn" id="focusBtn" title="집중 모드">⛶ 집중</button></div></header>
<div class="tabs" id="tabs"></div>
<aside class="left"><div class="side-head"><span>작품 · 원고</span><button id="newWork" title="새 작품">＋</button></div><input class="search" id="search" placeholder="작품 찾기…"><div class="tree-label">내 작품</div><div id="workTree"></div><div class="left-bottom"><button class="btn" id="newNote">＋ 메모</button><button class="btn" id="backupBtn">백업 관리</button></div></aside>
<main class="center" id="center"></main>
<aside class="right"><div class="ref-head"><span>참고 패널</span><button class="icon-btn" id="addRef" title="추가">＋</button></div><div class="ref-tabs"><button class="ref-tab active" data-ref="characters">인물</button><button class="ref-tab" data-ref="notes">메모</button><button class="ref-tab" data-ref="outline">목차</button></div><div class="ref-content" id="refContent"></div></aside>
</div><input type="file" id="fileInput" accept=".json,application/json" class="hidden"><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';
const KEY='storylab.fresh.workspace.v1', APP='storylab';
let state={app:APP,version:2,works:[],activeId:null,activeChapterId:null,refs:{characters:[],notes:[]},lastBackup:null};
let tabs=[],activeTab=null,split=false,focus=false,refPage='characters',timer=null,toastTimer=null;
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36);
function notify(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2200)}
function normalizeWork(w){w={...w};w.id=String(w.id||uid());w.title=String(w.title||w.name||'제목 없는 작품');w.description=String(w.description||w.summary||'');if(!Array.isArray(w.chapters)||!w.chapters.length){let body=typeof w.body==='string'?w.body:(typeof w.content==='string'?w.content:'');w.chapters=[{id:uid(),title:'첫 번째 장',body}]}w.chapters=w.chapters.map((c,i)=>({...c,id:String(c.id||uid()),title:String(c.title||('제 '+(i+1)+' 장')),body:typeof c.body==='string'?c.body:''}));w.activeChapterId=String(w.activeChapterId||w.cur||w.chapters[0].id);if(!w.chapters.some(c=>c.id===w.activeChapterId))w.activeChapterId=w.chapters[0].id;w.updatedAt=Number(w.updatedAt)||Date.now();return w}
function bodyOf(w){return w.chapters.find(c=>c.id===w.activeChapterId)||w.chapters[0]}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.works))state={...state,...s,works:s.works.map(normalizeWork),refs:s.refs||{characters:[],notes:[]}}}catch(e){}if(!state.works.length)state.works=[normalizeWork({id:uid(),title:'새로운 이야기',chapters:[{id:uid(),title:'첫 번째 장',body:''}]})];state.activeId=state.works.some(w=>w.id===state.activeId)?state.activeId:state.works[0].id;let w=activeWork();state.activeChapterId=w.activeChapterId;tabs=[{id:uid(),workId:w.id}];activeTab=tabs[0].id;persist(false)}
function activeWork(tabId=activeTab){let t=tabs.find(x=>x.id===tabId);return state.works.find(w=>w.id===(t?.workId||state.activeId))||state.works[0]}
function activeChapter(tabId=activeTab){let w=activeWork(tabId);if(!w)return null;let pane=tabs.find(t=>t.id===tabId);let cid=pane?.chapterId||w.activeChapterId;return w.chapters.find(c=>c.id===cid)||w.chapters[0]}
function persist(show=true){try{localStorage.setItem(KEY,JSON.stringify(state));if(show)$('#saveStatus')&&($('#saveStatus').textContent='저장됨')}catch(e){notify('저장 공간이 부족합니다. 백업해 주세요.')}}
function scheduleSave(){clearTimeout(timer);if($('#saveStatus'))$('#saveStatus').textContent='저장 중…';timer=setTimeout(()=>{persist();if($('#saveStatus'))$('#saveStatus').textContent='모든 변경사항 저장됨'},300)}
function updateWorkFromPane(id){let w=activeWork(id),c=activeChapter(id);if(!w||!c)return;let title=$('#pt-'+id),body=$('#pb-'+id);if(title)w.title=title.value||'제목 없는 작품';if(body)c.body=body.value;w.activeChapterId=c.id;w.updatedAt=Date.now();state.activeId=w.id;state.activeChapterId=c.id;$('#crumbTitle').textContent=w.title;scheduleSave();renderTree();renderTabs();if(!focus)renderRefs()}
function renderTree(){let q=$('#search').value.trim().toLowerCase();$('#workTree').innerHTML=state.works.filter(w=>(w.title+' '+w.description).toLowerCase().includes(q)).map(w=>'<div class="tree-row '+(w.id===state.activeId?'active':'')+'" data-work="'+esc(w.id)+'"><span class="dot">▸</span><span class="name">'+esc(w.title)+'</span><button class="mini-btn chapter-add" data-addchapter="'+esc(w.id)+'" title="장 추가">＋</button></div><div class="subtree">'+w.chapters.map(c=>'<div class="tree-row '+(w.id===state.activeId&&c.id===state.activeChapterId?'active':'')+'" data-chapter="'+esc(c.id)+'" data-owner="'+esc(w.id)+'"><span>·</span><span class="name">'+esc(c.title)+'</span></div>').join('')+'</div>').join('');$$('[data-work]').forEach(el=>el.onclick=()=>{state.activeId=el.dataset.work;let w=activeWorkById(el.dataset.work);state.activeChapterId=w.activeChapterId;let t=tabs.find(x=>x.id===activeTab);if(t){t.workId=w.id;t.chapterId=w.activeChapterId}persist(false);render()});$$('[data-chapter]').forEach(el=>el.onclick=()=>{let w=activeWorkById(el.dataset.owner);w.activeChapterId=el.dataset.chapter;state.activeId=w.id;state.activeChapterId=w.activeChapterId;let t=tabs.find(x=>x.id===activeTab);if(t){t.workId=w.id;t.chapterId=w.activeChapterId}persist(false);render()});$$('[data-addchapter]').forEach(el=>el.onclick=e=>{e.stopPropagation();let w=activeWorkById(el.dataset.addchapter),c={id:uid(),title:'새로운 장',body:''};w.chapters.push(c);w.activeChapterId=c.id;state.activeId=w.id;state.activeChapterId=c.id;let t=tabs.find(x=>x.id===activeTab);if(t){t.workId=w.id;t.chapterId=c.id}persist(false);render();let title=$('#pt-'+activeTab);title?.focus();title?.select()})}
function activeWorkById(id){return state.works.find(w=>w.id===id)||state.works[0]}
function renderTabs(){$('#tabs').innerHTML=tabs.map(t=>{let w=activeWork(t.id);return '<div class="tab '+(t.id===activeTab?'active':'')+'" data-tab="'+t.id+'"><span>'+esc(w.title)+'</span><span class="close" data-closetab="'+t.id+'">×</span></div>'}).join('')+'<button class="tab-plus" id="tabPlus" title="새 탭">＋</button>';$$('[data-tab]').forEach(el=>el.onclick=()=>{activeTab=el.dataset.tab;let w=activeWork();state.activeId=w.id;state.activeChapterId=activeChapter()?.id;render()});$$('[data-closetab]').forEach(el=>el.onclick=e=>{e.stopPropagation();if(tabs.length===1){notify('마지막 탭은 닫을 수 없습니다.');return}tabs=tabs.filter(t=>t.id!==el.dataset.closetab);if(activeTab===el.dataset.closetab)activeTab=tabs[tabs.length-1].id;render()});$('#tabPlus').onclick=()=>{let w=activeWork();let t={id:uid(),workId:w.id,chapterId:w.activeChapterId};tabs.push(t);activeTab=t.id;render()}}
function paneMarkup(t){let w=activeWork(t.id),c=activeChapter(t.id);return '<section class="pane" data-pane="'+t.id+'"><div class="editor-head"><input class="editor-title" id="pt-'+t.id+'" value="'+esc(w.title)+'" aria-label="작품 제목"><span class="divider"></span><button class="mini-btn" data-prev="'+t.id+'" title="이전 장">‹</button><span style="font-size:10px;color:#8c8598;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(c.title)+'</span><button class="mini-btn" data-next="'+t.id+'" title="다음 장">›</button><span class="spacer"></span><button class="mini-btn" data-newchapter="'+t.id+'" title="장 추가">＋ 장</button><span class="save-status" id="saveStatus">자동 저장</span></div><div class="write-area"><div class="paper"><p class="chapter-kicker">MANUSCRIPT / '+esc(c.title.toUpperCase())+'</p><input class="chapter-title" data-chaptertitle="'+t.id+'" value="'+esc(c.title)+'" aria-label="장 제목"><textarea class="body-edit" id="pb-'+t.id+'" placeholder="이야기를 시작하세요.\\n\\n생각의 흐름을 따라 편하게 써 내려가세요.">'+esc(c.body)+'</textarea></div></div><div class="editor-foot"><span data-words="'+t.id+'">'+c.body.replace(/\s/g,'').length+'자</span><span>공백 제외</span><span class="spacer"></span><button class="mini-btn" data-deletechapter="'+t.id+'">장 삭제</button></div></section>'}
function renderCenter(){let c=$('#center');c.innerHTML=split?'<div class="split">'+tabs.slice(0,2).map(paneMarkup).join('')+'</div>':paneMarkup(tabs.find(t=>t.id===activeTab)||tabs[0]);$$('[id^="pt-"]').forEach(el=>el.oninput=()=>{let t=el.id.slice(3);updateWorkFromPane(t)});$$('[id^="pb-"]').forEach(el=>el.oninput=()=>{let t=el.id.slice(3);let c=activeChapter(t);let w=activeWork(t);if(c)c.body=el.value;if(w)w.updatedAt=Date.now();let count=el.value.replace(/\s/g,'').length;let label=$('[data-words="'+t+'"]');if(label)label.textContent=count+'자';scheduleSave();if(!focus)renderRefs()});$$('[data-chaptertitle]').forEach(el=>el.oninput=()=>{let c=activeChapter(el.dataset.chaptertitle);if(c)c.title=el.value;let t=tabs.find(t=>t.id===el.dataset.chaptertitle);if(t)renderTabs();renderTree();scheduleSave()});$$('[data-newchapter]').forEach(el=>el.onclick=()=>{let w=activeWork(el.dataset.newchapter),c={id:uid(),title:'새로운 장',body:''};w.chapters.push(c);w.activeChapterId=c.id;let t=tabs.find(t=>t.id===el.dataset.newchapter);t.chapterId=c.id;state.activeId=w.id;state.activeChapterId=c.id;render()});$$('[data-prev],[data-next]').forEach(el=>el.onclick=()=>{let t=el.dataset.prev||el.dataset.next,w=activeWork(t),i=w.chapters.findIndex(c=>c.id===activeChapter(t).id),ni=el.dataset.prev?Math.max(0,i-1):Math.min(w.chapters.length-1,i+1);w.activeChapterId=w.chapters[ni].id;let pane=tabs.find(x=>x.id===t);pane.chapterId=w.activeChapterId;state.activeId=w.id;state.activeChapterId=w.activeChapterId;render()});$$('[data-deletechapter]').forEach(el=>el.onclick=()=>{let w=activeWork(el.dataset.deletechapter),t=tabs.find(x=>x.id===el.dataset.deletechapter);if(w.chapters.length===1){notify('작품에는 최소 한 장이 필요합니다.');return}let c=activeChapter(el.dataset.deletechapter);if(!confirm('현재 장을 삭제할까요?'))return;w.chapters=w.chapters.filter(x=>x.id!==c.id);w.activeChapterId=w.chapters[0].id;t.chapterId=w.activeChapterId;render();persist(false)})}
function renderRefs(){let box=$('#refContent');if(refPage==='outline'){box.innerHTML=state.works.map(w=>'<div class="tree-label">'+esc(w.title)+'</div>'+w.chapters.map(c=>'<div class="outline-row" data-jumpwork="'+w.id+'" data-jumpchapter="'+c.id+'">▸ '+esc(c.title)+'</div>').join('')).join('');$$('[data-jumpchapter]').forEach(el=>el.onclick=()=>{let t=tabs.find(x=>x.id===activeTab);t.workId=el.dataset.jumpwork;t.chapterId=el.dataset.jumpchapter;state.activeId=t.workId;state.activeChapterId=t.chapterId;render()});return}
let list=state.refs[refPage]||[];box.innerHTML='<input class="ref-search" id="refSearch" placeholder="'+(refPage==='characters'?'인물 찾기…':'메모 찾기…')+'">'+list.map((r,i)=>'<article class="ref-item"><button data-delref="'+i+'" title="삭제">×</button><strong>'+esc(r.title)+'</strong><p>'+esc(r.body)+'</p></article>').join('')+'<button class="ref-add" id="addRefItem">＋ '+(refPage==='characters'?'인물 추가':'메모 추가')+'</button>';$('#addRefItem').onclick=()=>{box.insertAdjacentHTML('beforeend','<div class="ref-item" id="refDraft"><input class="ref-editor" id="refDraftTitle" placeholder="이름 / 제목" style="min-height:30px"><textarea class="ref-editor" id="refDraftBody" placeholder="설정이나 메모를 적어 두세요"></textarea><button class="btn primary" id="saveRef">저장</button> <button class="btn" id="cancelRef">취소</button></div>');$('#saveRef').onclick=()=>{let title=$('#refDraftTitle').value.trim(),body=$('#refDraftBody').value.trim();if(!title&&!body){$('#refDraft').remove();return}state.refs[refPage].push({title:title||'제목 없음',body});persist(false);renderRefs()};$('#cancelRef').onclick=()=>$('#refDraft').remove()};$$('[data-delref]').forEach(el=>el.onclick=()=>{state.refs[refPage].splice(Number(el.dataset.delref),1);persist(false);renderRefs()});$('#refSearch').oninput=()=>{let q=$('#refSearch').value.toLowerCase();$$('.ref-item').forEach(el=>el.classList.toggle('hidden',!el.textContent.toLowerCase().includes(q)))}
}
function render(){document.body.classList.toggle('focus',focus);$('#splitBtn').classList.toggle('primary',split);$('#focusBtn').classList.toggle('primary',focus);$('#crumbTitle').textContent=activeWork()?.title||'원고';renderTabs();renderTree();renderCenter();renderRefs();$$('[data-ref]').forEach(b=>b.classList.toggle('active',b.dataset.ref===refPage))}
function newWork(){let w=normalizeWork({id:uid(),title:'새로운 이야기',chapters:[{id:uid(),title:'첫 번째 장',body:''}]});state.works.unshift(w);state.activeId=w.id;state.activeChapterId=w.activeChapterId;let t={id:uid(),workId:w.id,chapterId:w.activeChapterId};tabs.push(t);activeTab=t.id;split=false;persist(false);render();$('#pt-'+activeTab)?.focus();$('#pt-'+activeTab)?.select()}
function exportBackup(){let payload={app:APP,version:2,exportedAt:new Date().toISOString(),works:state.works.map(w=>({...w,body:bodyOf(w)?.body||''})),state:{...state,works:state.works.map(w=>({...w,body:bodyOf(w)?.body||''}))}};let a=document.createElement('a'),blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});a.href=URL.createObjectURL(blob);a.download='이야기공방-백업-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);state.lastBackup=Date.now();persist(false);notify('백업 파일을 저장했습니다.')}
function importBackup(file){if(!file)return;let fr=new FileReader();fr.onload=()=>{try{let o=JSON.parse(fr.result),works=Array.isArray(o)?o:(Array.isArray(o?.works)?o.works:(Array.isArray(o?.state?.works)?o.state.works:null));if(!works)throw Error('format');if(!confirm('백업 파일의 작품을 불러올까요? 같은 ID의 작품은 백업 내용으로 덮어씁니다.'))return;let map=new Map(state.works.map(w=>[w.id,w]));works.forEach(raw=>{if(!raw||typeof raw!=='object')return;let w=normalizeWork(raw);if(raw.body&&!raw.chapters?.length)w.chapters[0].body=raw.body;map.set(w.id,w)});state.works=[...map.values()];if(o?.state?.refs)state.refs=o.state.refs;state.activeId=state.works[0]?.id;state.activeChapterId=state.works[0]?.activeChapterId;tabs=[{id:uid(),workId:state.activeId,chapterId:state.activeChapterId}];activeTab=tabs[0].id;persist(false);render();notify('백업을 불러왔습니다.')}catch(e){notify('올바른 이야기공방 JSON 백업 파일인지 확인해 주세요.')}finally{$('#fileInput').value=''}};fr.readAsText(file,'utf-8')}
$('#newWork').onclick=newWork;$('#newNote').onclick=()=>{refPage='notes';render();$('#addRefItem').click()};$('#backupBtn').onclick=()=>$('#fileInput').click();$('#exportTop').onclick=exportBackup;$('#importTop').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>importBackup(e.target.files[0]);$('#search').oninput=renderTree;$('#splitBtn').onclick=()=>{if(!split){if(tabs.length<2){let w=activeWork();tabs.push({id:uid(),workId:w.id,chapterId:w.activeChapterId})}split=true}else split=false;render()};$('#focusBtn').onclick=()=>{focus=!focus;render()};$('#addRef').onclick=()=>$('#addRefItem')?.click();$$('[data-ref]').forEach(b=>b.onclick=()=>{refPage=b.dataset.ref;renderRefs();$$('[data-ref]').forEach(x=>x.classList.toggle('active',x===b))});load();render();
})();
</script></body></html>
