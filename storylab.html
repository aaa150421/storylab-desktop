<style>

8px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.cc[aria-pressed="true"] .dot{background:#fff!important}.sws{display:flex;gap:10px;flex-wrap:wrap;padding:6px 0 8px}.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);cursor:pointer}.sw[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}.tg{display:inline-block;border:1px solid var(--line);color:var(--mute);border-radius:10px;padding:1px 8px;font-size:12px;margin-left:4px}.tg.on{background:none;cursor:pointer;font:inherit;font-size:12px;color:var(--ink);padding:3px 10px;border-radius:12px;margin-left:0}.tgin{width:auto;flex:1 1 8em;min-width:6em;font-size:13px;padding:4px 8px}.grip{cursor:grab;color:var(--mute);padding:8px 2px;user-select:none;font-size:14px;letter-spacing:-3px}.dragging{position:relative;z-index:20;opacity:.9;box-shadow:0 4px 14px rgba(0,0,0,.25)}.dropb{box-shadow:0 -3px 0 var(--accent)}.dropa{box-shadow:0 3px 0 var(--accent)}.dropb.dh{box-shadow:-3px 0 0 var(--accent)}.dropa.dh{box-shadow:3px 0 0 var(--accent)}.dropz{outline:2px dashed var(--accent);outline-offset:2px}.fh{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 8px;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}.fh .fn{flex:1 1 8em;min-width:0;border:0;background:none;font-family:var(--serif);font-weight:600;font-size:16px;padding:4px}.fh .btn{padding:4px 8px;font-size:12px}.ft{border:0;background:none;color:var(--mute);font-size:14px;cursor:pointer;padding:4px}.fb{padding:10px 0 0 14px;border-left:2px solid var(--line);margin-left:14px}.fb .menu{margin-bottom:8px}.rootz{margin-top:20px}header{padding:14px max(18px,calc((100% - 760px)/2))}main{padding:18px max(18px,calc((100% - 760px)/2))}nav{padding:0 max(0px,calc((100% - 760px)/2))}.card{border-radius:10px}.wk{cursor:pointer;gap:6px}.wk,.menu{transition:border-color .15s,background .15s}.wk:hover,.menu:hover{border-color:var(--accent)}.wk:active,.menu:active{background:var(--bg)}.wkn{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}input.wkn{font-size:19px}.wks{color:var(--mute);font-size:13px}.wkf{display:flex;justify-content:space-between;align-items:center;margin-top:4px}.wko{color:var(--accent);font-weight:700;font-size:14px}.lk{border-color:transparent;background:none;color:var(--mute);font-size:13px;padding:6px 8px}.btn:hover:not(:disabled){border-color:var(--accent)}.fh{cursor:pointer}.hi{font-size:26px;margin:6px 0 20px}.hi{font-size:20px;margin:2px 0 14px}.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.menu.mini{flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;margin-bottom:0}.menu.mini .mn{font-size:15px}.menu.mini .ms{font-size:12px}.ctx{position:fixed;z-index:100;min-width:180px;max-width:260px;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.5)}.ci{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;font-size:14px;padding:8px 10px;border-radius:5px;cursor:pointer}.ci:hover:not(:disabled){background:var(--bg)}.ci:disabled{color:var(--mute);cursor:default}.cdel{color:var(--warn)}.csep{height:1px;background:var(--line);margin:4px 0}.chd{color:var(--mute);font-size:12px;padding:6px 10px 2px}.gear{background:none;border:0;color:var(--mute);font:inherit;font-size:12px;cursor:pointer;padding:4px 6px;border-radius:6px}.gear:hover{color:var(--ink)}.mvsel{font-size:13px;padding:4px 8px}::selection{background:var(--accent);color:var(--on-accent)}::placeholder{color:var(--mute);opacity:.8}*{scrollbar-color:var(--line) transparent}header{background:var(--bg)}.sbar{padding-bottom:18px;margin-bottom:20px;border-bottom:1px solid var(--line)}.sbar input{border-radius:24px;padding:12px 18px;font-size:15px}.card .bk{margin-top:0;border-top:0;padding-top:0}.dragmode,.dragmode *{user-select:none!important;cursor:grabbing!important}#f_name{font-family:var(--serif);font-size:18px;font-weight:600}.nr{display:flex;gap:8px;align-items:baseline}.nr #f_name{flex:1 1 50%;min-width:0}.nr #f_role{flex:1 1 50%;min-width:0;font-size:13px;color:var(--mute)}#q{margin-bottom:4px}.res{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;color:var(--ink);font:inherit;cursor:pointer}.rk{color:var(--accent);font-weight:700;font-size:12px;margin-right:8px}.rl{color:var(--mute);font-size:12px}.rs{display:block;margin-top:4px;font-family:var(--serif);line-height:1.6;font-size:14px}mark{background:var(--accent);color:var(--on-accent);border-radius:2px;padding:0 1px}
header span{color:var(--mute);font-size:13px}
main{flex:1;overflow-y:auto;padding:14px 16px;min-height:0}
nav{display:flex;border-top:1px solid var(--line);background:var(--surface)}
nav button{flex:1;padding:13px 0;border:0;background:none;color:var(--mute);font:500 14px var(--sans);cursor:pointer}
nav button[aria-selected="true"]{color:var(--accent);font-weight:700;box-shadow:inset 0 2px 0 var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
textarea{resize:vertical}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.title{font-family:var(--serif);font-size:20px;font-weight:600;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:8px 0}
.editor{font-family:var(--serif);font-size:17px;line-height:1.9;min-height:52vh;border:0;background:none;padding:12px 0;max-width:38em;display:block}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:13px;gap:8px;padding-top:6px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:500}
.btn.del{color:var(--warn);border-color:transparent;background:none;font-size:13px;padding:6px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;display:grid;gap:8px}
.card .row{display:flex;gap:8px}
.card .name{font-family:var(--serif);font-weight:600;font-size:17px}
.stage{font-family:var(--serif);font-size:16px;font-weight:600;margin:18px 0 8px;display:flex;justify-content:space-between}
.stage small{font:400 12px var(--sans);color:var(--mute)}
.pt{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.pt input[type=checkbox]{width:20px;height:20px;margin-top:8px;accent-color:var(--accent)}
.pt.done .pttitle{text-decoration:line-through;color:var(--mute)}
.pttitle{border:0;background:none;padding:6px 0;font-weight:500}
.ptnote{border:0;background:none;padding:0 0 4px;font-size:13px;color:var(--mute);resize:none}
.add{display:grid;grid-template-columns:1fr auto auto;gap:6px}
.empty{color:var(--mute);text-align:center;padding:36px 12px;line-height:1.7}
</style>
</head>
<body>
<header><button class="wn" id="wn" aria-label="작품 목록 열기"></button><span id="total"></span><button class="gear" id="gear">설정</button></header>
<main id="main"></main>
<nav role="tablist">
<button role="tab" data-tab="write">원고</button>
<button role="tab" data-tab="chars">인물</button>
<button role="tab" data-tab="plot">플롯</button>
<button role="tab" data-tab="wideas">아이디어</button>
</nav>
<script>
var KEY='storylab-v1', STAGES=['발단','전개','위기','절정','결말'];
function newWork(n){return {id:uid(),name:n,chapters:[{id:1,title:'1장',body:''}],chars:[],plots:[],cur:1};}
var R={works:[],w:null,tab:'write'};
try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);
 if(o.works){R=o;}else{o.id=uid();o.name='내 첫 작품';R={works:[o],w:o.id,tab:o.tab||'write'};}}}catch(e){}
if(!R.works.length){R.works.push(newWork('내 첫 작품'));}
if(!R.ideas)R.ideas=[];
var S;
var PAL=['#1f6f78','#b4483f','#7a4fa3','#2f6fb0','#a06a10','#3a7d44','#c2487b','#5d6b73'],PN=['청록','빨강','보라','파랑','황토','초록','분홍','회색'];
function pick(){S=R.works.find(function(x){return x.id===R.w;})||R.works[0];R.w=S.id;
  if(!S.folders)S.folders=[];
  if(!S.ideas)S.ideas=[];
  if(!S.trash)S.trash=[];
  TRASH=false;
  if(!S.psets||!S.psets.length)S.psets=[{id:uid(),name:'메인 플롯'}];
  S.plots.forEach(function(p){if(!p.set)p.set=S.psets[0].id;});
  if(!S.psets.some(function(x){return x.id===S.pcur;}))S.pcur=S.psets[0].id;
  S.chars.forEach(function(c,i){if(!c.color)c.color=PAL[i%PAL.length];});
  S.chars.forEach(function(c){if(!c.tags)c.tags=(c.role||'').split(/[,，、]/).map(function(t){return t.trim();}).filter(Boolean);});
}
pick();R.tab='home';
var armed=null,armT=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(R));}catch(e){}}
function $(s){return document.querySelector(s);}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function uid(){return Date.now()*1000+Math.floor(Math.random()*1000);}
function cnt(t){return t.replace(/\s/g,'').length;}
function cur(){return S.chapters.find(function(c){return c.id===S.cur;})||S.chapters[0];}
function updTotal(){var n=0;S.chapters.forEach(function(c){n+=cnt(c.body);});var ws=['write','chars','plot','wideas'].indexOf(R.tab)>=0;$('#wn').textContent=R.tab==='home'?'이야기공방':ws?'← '+(S.name||'제목 없음'):'← 메인';$('#wn').disabled=R.tab==='home';$('#total').textContent=ws?'전체 '+n.toLocaleString()+'자':(TITLES[R.tab]||'');document.querySelector('nav').hidden=!ws;$('#gear').hidden=R.tab!=='home';}
function confirmDel(key,fn,btn){
  if(armed===key){armed=null;fn();save();render();return;}
  armed=key;btn.textContent='한 번 더 눌러 삭제';
  clearTimeout(armT);armT=setTimeout(function(){armed=null;render();},3000);
}
function render(){
  document.querySelectorAll('nav button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===R.tab);});
  updTotal();
  var ws=['write','chars','plot','wideas'];if(ws.indexOf(R.tab)>=0&&ws.indexOf(PREV)<0)BACK=PREV;PREV=R.tab;
  ({home:rHome,shelf:rShelf,ideas:rIdeas,wideas:rWIdeas,settings:rSettings,write:rWrite,chars:rChars,plot:rPlot})[R.tab]();
}
var EDIT=false,RN=null;
function orderFiles(){var o=[];S.folders.forEach(function(f){S.chapters.forEach(function(c){if(c.folder===f.id)o.push(c);});});S.chapters.forEach(function(c){if(!S.folders.some(function(f){return f.id===c.folder;}))o.push(c);});return o;}
function folderOpts(c){return '<option value="0"'+(!c.folder?' selected':'')+'>폴더 없음</option>'+S.folders.map(function(f){return '<option value="'+f.id+'"'+(c.folder===f.id?' selected':'')+'>'+esc(f.name||'이름 없음')+'</option>';}).join('');}
function fileRow(c){
  var sum=(c.body||'').replace(/\s+/g,' ').trim().slice(0,50);
  return '<button class="menu fr" data-id="'+c.id+'" style="display:block"><span class="mn" style="font-size:16px">'+esc(c.title||'제목 없음')+'</span> <span class="ms">'+cnt(c.body||'').toLocaleString()+'자</span>'+(sum?'<span class="ms" style="display:block;margin-top:3px">'+esc(sum)+'</span>':'')+'</button>';
}
function moveFile(f,t,b,tg){
  var i=S.chapters.findIndex(function(x){return String(x.id)===f;});if(i<0)return;
  var it=S.chapters.splice(i,1)[0];
  if(tg.classList.contains('fh')){it.folder=+tg.dataset.fid;S.chapters.push(it);S.folders.forEach(function(x){if(x.id===it.folder)x.open=true;});}
  else{var j=S.chapters.findIndex(function(x){return String(x.id)===t;});var tp=S.chapters[j];it.folder=tp?tp.folder:0;S.chapters.splice(j<0?S.chapters.length:(b?j:j+1),0,it);}
  save();render();
}
function closeCtx(){var d=document.getElementById('ctx');if(d)d.remove();}
document.addEventListener('click',closeCtx);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeCtx();});
document.addEventListener('scroll',closeCtx,true);
window.addEventListener('blur',closeCtx);
document.addEventListener('contextmenu',function(e){if(!e.target.closest('.fr'))closeCtx();});
function ctxMenu(e,items){
  e.preventDefault();closeCtx();
  var d=document.createElement('div');d.id='ctx';d.className='ctx';d.setAttribute('role','menu');
  items.forEach(function(it){
    if(it.sep){var s=document.createElement('div');s.className='csep';d.appendChild(s);return;}
    if(it.hd){var h=document.createElement('div');h.className='chd';h.textContent=it.hd;d.appendChild(h);return;}
    var b=document.createElement('button');b.className='ci'+(it.del?' cdel':'');b.textContent=it.label;b.disabled=!!it.off;
    b.onclick=function(ev){ev.stopPropagation();it.fn(b);};
    d.appendChild(b);
  });
  document.body.appendChild(d);
  var w=d.offsetWidth,h2=d.offsetHeight;
  d.style.left=Math.max(4,Math.min(e.clientX,innerWidth-w-4))+'px';d.style.top=Math.max(4,Math.min(e.clientY,innerHeight-h2-4))+'px';
}
function mvFile(c,fid){closeCtx();var i=S.chapters.indexOf(c);S.chapters.splice(i,1);c.folder=fid;S.chapters.push(c);if(fid)S.folders.forEach(function(f){if(f.id===fid)f.open=true;});save();render();}
function fileMenu(e,c){
  var items=[{label:'열기',fn:function(){closeCtx();S.cur=c.id;EDIT=true;save();render();}},{sep:1},{hd:'이동'}];
  if(c.folder)items.push({label:'폴더 밖으로',fn:function(){mvFile(c,0);}});
  S.folders.forEach(function(f){if(f.id!==c.folder)items.push({label:'→ '+(f.name||'이름 없음'),fn:function(){mvFile(c,f.id);}});});
  if(!c.folder&&!S.folders.length)items.push({label:'이동할 폴더가 없어요',off:1,fn:function(){}});
  var armed2=false,last=S.chapters.length<2;
  items.push({sep:1});
  items.push({label:last?'휴지통으로 (마지막 파일)':'휴지통으로',del:1,off:last,fn:function(){closeCtx();trashFile(c);save();render();}});
  ctxMenu(e,items);
}
var TRASH=false;
function ymdT(t){var d=new Date(t);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function trashFile(c){
  var i=S.chapters.indexOf(c);if(i<0)return;
  S.chapters.splice(i,1);c.deleted=Date.now();S.trash.push(c);
  if(S.cur===c.id&&S.chapters.length)S.cur=S.chapters[0].id;
}
function rTrash(){
  var m=$('#main');
  var h='<div class="tr" style="margin-bottom:12px"><button class="btn" id="tb">← 원고 목록</button><span class="ms" style="margin-left:auto">휴지통 '+S.trash.length+'개</span>'+(S.trash.length?'<button class="btn del" id="te">비우기</button>':'')+'</div>';
  if(!S.trash.length)h+='<div class="empty">휴지통이 비어 있어요.<br>삭제한 파일이 여기에 들어와요.</div>';
  S.trash.slice().reverse().forEach(function(c){
    h+='<div class="card" data-tid="'+c.id+'"><div class="wkn" style="font-size:16px">'+esc(c.title||'제목 없음')+'</div><div class="wks">'+cnt(c.body||'').toLocaleString()+'자, '+ymdT(c.deleted||Date.now())+' 삭제</div><div class="wkf"><span></span><span><button class="btn lk" data-rs="1">복원</button><button class="btn del" data-pd="1">영구 삭제</button></span></div></div>';
  });
  m.innerHTML=h;
  $('#tb').onclick=function(){TRASH=false;render();};
  var te=$('#te');if(te)te.onclick=function(e){confirmDel('te',function(){S.trash=[];},e.target);};
  m.querySelectorAll('.card').forEach(function(card){
    var c=S.trash.find(function(x){return x.id===+card.dataset.tid;});
    card.querySelector('[data-rs]').onclick=function(){S.trash=S.trash.filter(function(x){return x!==c;});delete c.deleted;if(!S.folders.some(function(f){return f.id===c.folder;}))c.folder=0;S.chapters.push(c);save();render();};
    card.querySelector('[data-pd]').onclick=function(e){confirmDel('pd'+c.id,function(){S.trash=S.trash.filter(function(x){return x!==c;});},e.target);};
  });
}
function rWrite(){if(TRASH)rTrash();else if(EDIT)rEdit();else rList();}
function rList(){

var Q='',REV=null,NOTE='';
function ymd(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function exportBackup(){
  var blob=new Blob([JSON.stringify({app:'storylab',v:1,works:R.works,ideas:R.ideas})],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='이야기공방-백업-'+ymd()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  R.bk=ymd();save();NOTE='백업 파일을 저장했어요. 다운로드 폴더를 확인해 보세요.';
}
function importBackup(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var o=JSON.parse(fr.result);if(!o||o.app!=='storylab'||!Array.isArray(o.works))throw 0;
      o.works.forEach(function(w){var i=R.works.findIndex(function(x){return x.id===w.id;});if(i>=0)R.works[i]=w;else R.works.push(w);});
      (o.ideas||[]).forEach(function(x){if(!R.ideas.some(function(y){return y.id===x.id;}))R.ideas.push(x);});
      pick();save();NOTE='작품 '+o.works.length+'편과 아이디어를 불러왔어요.';
    }catch(e){NOTE='이야기공방 백업 파일이 아니어서 불러올 수 없어요.';}
    render();
  };
  fr.readAsText(file);
}

  NOTE='';return h;

function revealIn(ed,pos,len){
  $('#main').scrollTop=0;ed.focus();var v=ed.value;ed.value=v.slice(0,pos);var h=ed.scrollHeight;ed.value=v;
  ed.scrollTop=Math.max(0,h-ed.clientHeight/2);ed.setSelectionRange(pos,pos+len);
}
function jump(w,tab,cid){R.w=w.id;pick();if(cid){S.cur=cid;EDIT=true;}else if(tab==='write')EDIT=false;R.tab=tab;save();render();}
function hl(t,q,i){
  var s=Math.max(0,i-20),e=Math.min(t.length,i+q.length+50);
  function c(x){return esc(x.replace(/\s+/g,' '));}
  return (s?'…':'')+c(t.slice(s,i))+'<mark>'+c(t.slice(i,i+q.length))+'</mark>'+c(t.slice(i+q.length,e))+(e<t.length?'…':'');
}
function search(q){
  var L=q.toLowerCase(),out=[];
  function add(k,loc,fields,go){fields.forEach(function(f,fi){if(!f)return;var lo=f.toLowerCase(),i=lo.indexOf(L);while(i>=0&&out.length<500){(function(p){out.push({k:k,loc:loc,text:f,pos:p,go:function(){go(p,L.length,fi);}});})(i);i=lo.indexOf(L,i+L.length);}});}
  R.works.forEach(function(w){
    add('작품',w.name,[w.name],function(){jump(w,'write');});
    w.chapters.forEach(function(c){add('원고',w.name+', '+(c.title||'제목 없음'),[c.title,c.body],function(p,l,fi){if(fi===1)REV={pos:p,len:l};jump(w,'write',c.id);});add('메모',w.name+', '+(c.title||'제목 없음'),[c.memo],function(){jump(w,'write',c.id);});});
    w.chars.forEach(function(c){add('인물',w.name+', '+(c.name||'이름 없음'),[c.name,c.tags?c.tags.join(' '):c.role,c.age,c.look,c.trait,c.goal,c.secret,c.voice,c.rel,c.desc],function(){CID=c.id;jump(w,'chars');});});
    w.plots.forEach(function(p){add('플롯',w.name+', '+(((w.psets||[]).find(function(s){return s.id===p.set;})||{}).name||'플롯')+', '+p.stage,[p.title,p.note,(p.chars||[]).map(function(id){var c=w.chars.find(function(x){return x.id===id;});return c?c.name:'';}).join(' ')],function(){if(p.set)w.pcur=p.set;jump(w,'plot');});});
  });
  R.works.forEach(function(w){(w.ideas||[]).forEach(function(x){add('아이디어',w.name+', '+x.tag,[x.text],function(){R.tf='';jump(w,'wideas');});});});
  R.ideas.forEach(function(x){add('아이디어',x.tag,[x.text],function(){R.tab='ideas';R.tf='';save();render();});});
  return out;
}
function showSearch(){
  var q=Q.trim(),res=$('#res'),hm=$('#hm');hm.hidden=!!q;
  if(!q){res.innerHTML='';return;}
  var out=search(q);
  res.innerHTML=out.length?'<div class="sec">검색 결과 '+out.length+'곳'+(out.length>200?' (앞의 200곳만 표시)':'')+'</div>'+out.slice(0,200).map(function(o,i){return '<button class="res" data-i="'+i+'"><span class="rk">'+o.k+'</span><span class="rl">'+esc(o.loc)+'</span><span class="rs">'+hl(o.text,q,o.pos)+'</span></button>';}).join(''):'<div class="empty">“'+esc(q)+'” 검색 결과가 없어요.<br>다른 단어로 다시 찾아보세요.</div>';
  res.querySelectorAll('.res').forEach(function(b){b.onclick=function(){out[+b.dataset.i].go();};});
}

function ideasView(isW){

  $('#addi').onclick=function(){var t=$('#it').value.trim();if(!t){$('#it').focus();return;}A.unshift({id:uid(),text:t,tag:$('#itag').value});save();render();};
  m.querySelectorAll('.chip[data-t]').forEach(function(b){b.onclick=function(){R.tf=b.dataset.t;save();render();};});
  m.querySelectorAll('.card').forEach(function(card){
    var x=A.find(function(i){return i.id===+card.dataset.id;});

    card.querySelector('[data-mv]').onchange=function(e){

  return '<div class="ml">등장 사건 '+ev.length+'개</div>'+(ev.length?ev.map(function(e,i){return '<button class="menu" data-ev="'+i+'" style="display:block;padding:10px 12px"><span class="mn" style="font-size:15px">'+esc(e.p.title||'제목 없음')+'</span> <span class="ms">'+esc((e.ps?e.ps.name+', ':'')+e.p.stage)+'</span></button>';}).join(''):'<div class="ms">플롯에서 이 인물을 등장인물로 지정하면 여기에 모여요.</div>');
}
var CF=[['age','나이','input'],['look','외모','area'],['trait','성격','area'],['goal','목표와 동기','area'],['secret','비밀과 약점','area'],['voice','말투','area'],['rel','다른 인물과의 관계','area'],['desc','기타 설정','area']];
function rChars(){
  var m=$('#main'),x=S.chars.find(function(c){return c.id===CID;});
  if(!x){
    CID=null;
    m.innerHTML='<button class="btn primary" id="addc" style="width:100%;margin-bottom:14px">인물 추가</button>'+tfHtml()+(S.chars.length?S.chars.filter(function(c){return !TG||(c.tags||[]).indexOf(TG)>=0;}).map(function(c){
      var sum=(c.trait||c.goal||c.look||c.desc||'').replace(/\s+/g,' ').slice(0,60);
      return '<button class="menu" data-id="'+c.id+'" style="display:block"><i class="dot" style="background:'+esc(c.color||'')+'"></i><span class="mn">'+esc(c.name||'이름 없음')+'</span> '+tagsHtml(c)+(sum?'<span class="ms" style="display:block;margin-top:4px">'+esc(sum)+'</span>':'')+'</button>';
    }).join(''):'<div class="empty">아직 인물이 없어요.<br>이야기에 나올 첫 인물을 추가해 보세요.</div>');
    $('#addc').onclick=function(){var n={id:uid(),name:'',role:'',color:PAL[S.chars.length%PAL.length]};S.chars.unshift(n);CID=n.id;save();render();};
    dragSort(m,'.menu[data-id]','id',false,null,null,function(f,t,b){moveItem(S.chars,f,t,b);save();render();});
    m.querySelectorAll('[data-tf]').forEach(function(b){b.onclick=function(){TG=b.dataset.tf;render();};});
    m.querySelectorAll('.menu').forEach(function(b){b.onclick=function(){CID=+b.dataset.id;render();};});
    return;
  }
  m.innerHTML='<button class="btn" id="cb" style="margin-bottom:14px">← 인물 목록</button><div class="card"><div class="nr"><input id="f_name" data-f="name" placeholder="이름" aria-label="이름" value="'+esc(x.name)+'"></div>'+tagEd(x)+'<div class="ml" style="margin:4px 0 0">대표 색</div><div class="sws">'+PAL.map(function(h,i){return '<button class="sw" data-col="'+h+'" aria-label="'+PN[i]+'" aria-pressed="'+(x.color===h)+'" style="background:'+h+'"></button>';}).join('')+'</div>'+CF.map(function(f){
    return '<label class="ml" style="margin:4px 0 0" for="f_'+f[0]+'">'+f[1]+'</label>'+(f[2]==='input'?'<input id="f_'+f[0]+'" data-f="'+f[0]+'" placeholder="'+(f[3]||'')+'" value="'+esc(x[f[0]])+'">':'<textarea id="f_'+f[0]+'" data-f="'+f[0]+'" rows="3">'+esc(x[f[0]])+'</textarea>');
  }).join('')+'<div class="row" style="justify-content:flex-end"><button class="btn del" id="dc">이 인물 삭제</button></div></div>'+evHtml(x)+'';
  m.querySelectorAll('[data-f]').forEach(function(i){i.oninput=function(){x[i.dataset.f]=i.value;save();};});
  m.querySelectorAll('[data-col]').forEach(function(b){b.onclick=function(){x.color=b.dataset.col;save();render();};});
  function addTag(t){t.split(/[,，]/).forEach(function(s){s=s.trim();if(!s)return;x.tags=x.tags||[];if(x.tags.indexOf(s)<0)x.tags.push(s);});save();render();var i=$('#tgin');if(i)i.focus();}
  $('#tgadd').onclick=function(){addTag($('#tgin').value);};
  $('#tgin').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();addTag(e.target.value);}};
  m.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){x.tags.splice(+b.dataset.rm,1);save();render();};});
  m.querySelectorAll('[data-sg]').forEach(function(b){b.onclick=function(){addTag(b.dataset.sg);};});
  m.querySelectorAll('[data-ev]').forEach(function(b){b.onclick=function(){var e=evList(x)[+b.dataset.ev];S.pcur=e.p.set;PF=x.id;R.tab='plot';save();render();};});
  $('#cb').onclick=function(){CID=null;render();};
  $('#dc').onclick=function(e){confirmDel('c'+x.id,function(){S.chars=S.chars.filter(function(c){return c!==x;});CID=null;},e.target);};
  if(!x.name)$('#f_name').focus();
}
function moveItem(arr,f,t,b){
  var i=arr.findIndex(function(x){return String(x.id)===f;});if(i<0)return;
  var it=arr.splice(i,1)[0];
  var j=arr.findIndex(function(x){return String(x.id)===t;});
  arr.splice(j<0?arr.length:(b?j:j+1),0,it);
}
function movePlot(f,t,b,tg){
  var i=S.plots.findIndex(function(x){return String(x.id)===f;});if(i<0)return;
  var it=S.plots.splice(i,1)[0];
  if(tg.classList.contains('stage')){it.stage=tg.dataset.st;S.plots.push(it);}
  else{var j=S.plots.findIndex(function(x){return String(x.id)===t;});var tp=S.plots[j];if(tp)it.stage=tp.stage;S.plots.splice(j<0?S.plots.length:(b?j:j+1),0,it);}
  save();render();
}
function dragSort(root,sel,key,horiz,handle,extra,onDrop){
  function clr(){root.querySelectorAll('.dropb,.dropa,.dropz').forEach(function(n){n.classList.remove('dropb','dropa','dropz','dh');});}
  root.querySelectorAll(sel).forEach(function(el){
    var h=handle?el.querySelector(handle):el;if(!h)return;
    h.addEventListener('pointerdown',function(e){
      if(e.pointerType!=='mouse'||e.button!==0)return;
      var sx=e.clientX,sy=e.clientY,on=false,tgt=null,before=true;
      function mv(ev){
        if(!on){if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)<6)return;on=true;el.classList.add('dragging');document.body.classList.add('dragmode');el.style.pointerEvents='none';}
        el.style.transform='translate('+(ev.clientX-sx)+'px,'+(ev.clientY-sy)+'px)';
        clr();tgt=null;
        var t=document.elementFromPoint(ev.clientX,ev.clientY);t=t&&t.closest(extra?sel+','+extra:sel);
        if(!t||t===el||!root.contains(t))return;
        if(extra&&t.matches(extra)){t.classList.add('dropz');before=false;}
        else{var r=t.getBoundingClientRect();before=horiz?ev.clientX<r.left+r.width/2:ev.clientY<r.top+r.height/2;t.classList.add(before?'dropb':'dropa');if(horiz)t.classList.add('dh');}
        tgt=t;
      }
      function up(){
        document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
        if(!on)return;
        el.classList.remove('dragging');el.style.transform='';el.style.pointerEvents='';document.body.classList.remove('dragmode');clr();
        var sup=function(c){c.stopPropagation();c.preventDefault();};
        window.addEventListener('click',sup,true);setTimeout(function(){window.removeEventListener('click',sup,true);},0);
        if(tgt)onDrop(el.dataset[key],tgt.dataset[key],before,tgt);
      }
      document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
    });
  });
}
var PF=0;
function cchip(c,on,attr){var col=c.color||'';return '<button class="chip cc" '+attr+' aria-pressed="'+on+'" style="'+(on?'background:'+col+';border-color:'+col+';color:#fff':'')+'"><i class="dot" style="background:'+col+'"></i>'+esc(c.name||'이름 없음')+'</button>';}
function flHtml(){
  if(!S.chars.length)return '';
  if(PF&&!S.chars.some(function(c){return c.id===PF;}))PF=0;
  return '<div class="ml" style="margin:0 0 4px">인물별 보기</div><div class="chips"><button class="chip" data-pf="0" aria-pressed="'+(!PF)+'">전체</button>'+S.chars.map(function(c){return cchip(c,PF===c.id,'data-pf="'+c.id+'"');}).join('')+'</div>';
}
var PK=null;
function whoHtml(p){
  var ids=p.chars||[];
  var bs=ids.map(function(id){var c=S.chars.find(function(x){return x.id===id;});return c?'<span class="wb" style="background:'+esc(c.color||'')+'">'+esc(c.name||'이름 없음')+'</span>':'';}).join('');
  var h='<div class="who">'+bs+'<button class="wadd" data-pk="1">'+(PK===p.id?'닫기':(ids.length?'인물 편집':'+ 등장인물'))+'</button></div>';
  if(PK===p.id){
    h+='<div class="wpick">'+(S.chars.length?S.chars.map(function(c){return cchip(c,ids.indexOf(c.id)>=0,'data-cid="'+c.id+'"');}).join(''):'<span class="ms">인물 탭에서 먼저 인물을 추가하세요.</span>')+'</div>';
  }
  return h;
}
function rPlot(){
  var m=$('#main');
  var cs=S.psets.find(function(x){return x.id===S.pcur;});
  var h='<div class="chips">'+S.psets.map(function(x){return '<button class="chip" data-s="'+x.id+'" aria-pressed="'+(x.id===cs.id)+'">'+esc(x.name||'이름 없음')+'</button>';}).join('')+'<button class="chip" id="addps">+ 새 플롯</button></div><div class="tr" style="margin-bottom:12px"><input class="title" id="psn" aria-label="플롯 이름" placeholder="플롯 이름" value="'+esc(cs.name)+'"><button class="btn del" id="dps">삭제</button></div>'+flHtml()+'<div class="add"><input id="pt" placeholder="사건 한 줄"><select id="ps" aria-label="단계">'+STAGES.map(function(s){return '<option>'+s+'</option>';}).join('')+'</select><button class="btn primary" id="addp">추가</button></div>';
  STAGES.forEach(function(st){
    var list=S.plots.filter(function(p){return p.stage===st&&p.set===cs.id&&(!PF||(p.chars||[]).indexOf(PF)>=0);});
    var done=list.filter(function(p){return p.done;}).length;
    h+='<div class="stage" data-st="'+st+'"><span>'+st+'</span><small>'+(list.length?done+'/'+list.length+' 완료':'비어 있음')+'</small></div>';
    list.forEach(function(p){
      h+='<div class="pt'+(p.done?' done':'')+'" data-id="'+p.id+'"><span class="grip" title="끌어서 순서 변경">⋮⋮</span><input type="checkbox" aria-label="완료" '+(p.done?'checked':'')+'><div><input class="pttitle" data-f="title" value="'+esc(p.title)+'">'+whoHtml(p)+'<textarea class="ptnote" data-f="note" rows="2" placeholder="메모">'+esc(p.note)+'</textarea></div><button class="btn del" data-del="1">삭제</button></div>';
    });
  });
  m.innerHTML=h;
  dragSort(m,'.chip[data-s]','s',true,null,null,function(f,t,b){moveItem(S.psets,f,t,b);save();render();});
  dragSort(m,'.pt','id',false,'.grip','.stage',movePlot);
  m.querySelectorAll('[data-pf]').forEach(function(b){b.onclick=function(){PF=+b.dataset.pf;render();};});
  m.querySelectorAll('.chip[data-s]').forEach(function(b){b.onclick=function(){S.pcur=+b.dataset.s;save();render();};});
  $('#addps').onclick=function(){var n={id:uid(),name:'서브플롯 '+S.psets.length};S.psets.push(n);S.pcur=n.id;save();render();$('#psn').focus();$('#psn').select();};
  $('#psn').oninput=function(e){cs.name=e.target.value;save();var ch=m.querySelector('.chip[data-s="'+cs.id+'"]');if(ch)ch.textContent=cs.name||'이름 없음';};
  $('#dps').onclick=function(e){
    if(S.psets.length<2){e.target.textContent='마지막 플롯은 삭제할 수 없어요';return;}
    confirmDel('ps'+cs.id,function(){S.psets=S.psets.filter(function(x){return x!==cs;});S.plots=S.plots.filter(function(p){return p.set!==cs.id;});S.pcur=S.psets[0].id;},e.target);
  };
  function add(){var t=$('#pt').value.trim();if(!t){$('#pt').focus();return;}S.plots.push({id:uid(),title:t,note:'',stage:$('#ps').value,set:cs.id,done:false});save();render();}
  $('#addp').onclick=add;
  $('#pt').onkeydown=function(e){if(e.key==='Enter')add();};
  m.querySelectorAll('.pt').forEach(function(row){
    var p=S.plots.find(function(x){return x.id===+row.dataset.id;});
    row.querySelector('[type=checkbox]').onchange=function(e){p.done=e.target.checked;row.classList.toggle('done',p.done);save();};
    row.querySelector('[data-pk]').onclick=function(){PK=PK===p.id?null:p.id;render();};
    row.querySelectorAll('[data-cid]').forEach(function(b){b.onclick=function(){var id=+b.dataset.cid;p.chars=p.chars||[];var i=p.chars.indexOf(id);if(i>=0)p.chars.splice(i,1);else p.chars.push(id);save();render();};});
    row.querySelectorAll('[data-f]').forEach(function(i){i.oninput=function(){p[i.dataset.f]=i.value;save();};});
    row.querySelector('[data-del]').onclick=function(e){confirmDel('p'+p.id,function(){S.plots=S.plots.filter(function(x){return x!==p;});},e.target);};
  });
}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){CID=null;if(b.dataset.tab==='write'){EDIT=false;TRASH=false;}R.tab=b.dataset.tab;save();render();};});
$('#wn').onclick=function(){R.tab=['write','chars','plot','wideas'].indexOf(R.tab)>=0?(BACK||'home'):'home';save();render();};
$('#gear').onclick=function(){R.tab='settings';save();render();};
render();
</script>
