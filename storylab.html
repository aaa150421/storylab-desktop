ointer-events:none}.relation-node .node-sub{fill:var(--mute);font:11px var(--sans)}.relation-node:focus rect{stroke:var(--accent)}.relation-map-help{font-size:12px;color:var(--mute);margin:8px 2px 0}.relation-legend{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.relation-legend span{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:12px;padding:3px 8px}.relationship-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.relation-line{color:var(--mute)}.world-item{margin-bottom:8px}.world-type{display:inline-block;color:var(--accent);font-size:11px;letter-spacing:.04em;margin-right:8px}.world-filters{flex-wrap:wrap}.world-filters .chip{max-width:none}.world-item .mn{display:inline}

.title{font-family:var(--serif);font-size:20px;font-weight:600;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:8px 0}
.editor{font-family:var(--serif);font-size:17px;line-height:1.9;min-height:52vh;border:0;background:none;padding:12px 0;max-width:38em;display:block}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:13px;gap:8px;padding-top:6px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:500}
.btn.del{color:var(--warn);border-color:transparent;background:none;font-size:13px;padding:6px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;display:grid;gap:8px}
.card .row{display:flex;gap:8px}
.card .name{font-family:var(--serif);font-weight:600;font-size:17px}
.pt{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.pt input[type=checkbox]{width:20px;height:20px;margin-top:8px;accent-color:var(--accent)}
.pt.done .pttitle{text-decoration:line-through;color:var(--mute)}
.pttitle{border:0;background:none;padding:6px 0;font-weight:500}
.ptnote{border:0;background:none;padding:0 0 4px;font-size:13px;color:var(--mute);resize:none}
.add{display:grid;grid-template-columns:1fr auto auto;gap:6px}
.empty{color:var(--mute);text-align:center;padding:36px 12px;line-height:1.7}

/* Visual refresh: calmer spacing, clearer hierarchy, and consistent controls. */
:root{--bg:#101113;--surface:#191b1f;--ink:#f0eee8;--mute:#a0a2aa;--line:#303239;--accent:#82d9ad;--on-accent:#10251a;--warn:#f08b96}
body{font-size:14px;letter-spacing:-.01em}
header{min-height:58px;gap:12px;padding:12px max(20px,calc((100% - 900px)/2));background:rgba(16,17,19,.96);border-bottom-color:rgba(255,255,255,.09)}
main{width:100%;max-width:940px;margin:0 auto;padding:24px clamp(18px,4vw,34px);}
nav{padding:0 max(0px,calc((100% - 900px)/2));background:var(--surface);border-top-color:rgba(255,255,255,.09)}
nav button{padding:15px 8px;transition:color .15s,background .15s}
nav button:hover{color:var(--ink);background:rgba(255,255,255,.025)}
nav button[aria-selected="true"]{box-shadow:inset 0 3px 0 var(--accent)}
.card,.menu,.fh,.res{border-radius:12px;border-color:var(--line);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card{padding:16px;gap:10px}
.menu{padding:17px 16px;margin-bottom:10px}
.menu:hover,.res:hover,.card:focus-within{border-color:#4a6858}
.btn{border-radius:8px;padding:9px 13px;transition:background .15s,border-color .15s,transform .08s}
.btn:active{transform:translateY(1px)}
.btn.primary{box-shadow:0 2px 8px rgba(130,217,173,.12)}
input,textarea,select{border-radius:8px;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(130,217,173,.09);outline:none}
.editor{font-size:18px;line-height:2;max-width:42em;padding-top:18px;min-height:54vh}
.title{font-size:22px}
.hi{font-size:23px;line-height:1.55;margin:8px 0 18px}
.sec{font-size:12px;letter-spacing:.04em;text-transform:none;margin-top:25px}
.sbar{border-bottom-color:var(--line)}
.sbar input{background:var(--surface);border-color:transparent}
.gear{padding:7px 11px;border:1px solid var(--line);border-radius:8px}
.gear:hover{background:var(--surface);border-color:#4a6858}
.save-status{min-width:80px;text-align:right}
.setting-section-title{font-size:16px;font-weight:700;margin:0 0 5px}
.setting-help{font-size:13px;color:var(--mute);line-height:1.7;margin:0}
.shortcut-list{display:grid;gap:0;margin-top:10px}
.shortcut-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.shortcut-row:first-child{border-top:0}
.shortcut-desc{font-size:14px}
kbd{display:inline-block;min-width:34px;padding:4px 8px;text-align:center;border:1px solid #484b53;border-bottom-width:2px;border-radius:6px;background:#22252a;color:var(--ink);font:600 12px var(--sans);white-space:nowrap}
.shortcut-keys{display:flex;align-items:center;gap:5px;flex:none}

.doc-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.doc-tab{display:flex;align-items:center;flex:none;max-width:220px;border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden}
.doc-tab-open{border:0;background:none;color:var(--mute);font:inherit;font-size:13px;padding:9px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:175px;cursor:pointer}
.doc-tab-open[aria-current=page]{color:var(--accent);font-weight:700;background:rgba(130,217,173,.08)}
.doc-tab-close{border:0;border-left:1px solid var(--line);background:none;color:var(--mute);font-size:17px;padding:5px 8px;cursor:pointer}
.doc-tab-close:hover{color:var(--warn);background:rgba(240,139,150,.08)}
.plot-time-label{display:block;color:var(--mute);font-size:12px;margin:5px 0 8px}
.plot-time{display:block;margin-top:4px;font-size:13px;max-width:320px}
.timeline-panel{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px;margin:12px 0 18px;min-width:0}
.timeline-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.timeline-title{font-family:var(--serif);font-weight:600;font-size:16px}
.timeline-help{font-size:12px;color:var(--mute)}
.timeline-scroll{overflow-x:auto;overflow-y:hidden;padding:4px 2px 10px;touch-action:pan-x;}
.timeline-track{display:flex;align-items:stretch;gap:0;min-width:max-content;}
.timeline-event{position:relative;flex:0 0 150px;width:150px;min-width:150px;padding:0 8px;cursor:default}
.timeline-date{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.timeline-rail{height:14px;display:flex;align-items:center;margin-bottom:8px}
.timeline-dot{flex:0 0 12px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);outline:1px solid var(--accent);z-index:1}
.timeline-line{height:2px;background:var(--line);flex:1;min-width:8px}
.timeline-event:last-child .timeline-line{background:transparent}
.timeline-card{border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:8px;min-height:64px;display:flex;gap:6px;align-items:flex-start}
.timeline-card .grip{padding:0;font-size:12px;flex:none}
.timeline-event-title{font-size:12px;line-height:1.5;overflow-wrap:anywhere;min-width:0}
.timeline-empty{font-size:13px;color:var(--mute);padding:12px 2px}
.timeline-event.dragging .timeline-card{border-color:var(--accent)}
.timeline-group{flex:0 0 166px;width:166px;min-width:166px;display:flex;flex-direction:column;align-items:stretch;padding:0 8px}
.timeline-group-date{font-size:11px;color:var(--mute);white-space:normal;line-height:1.5;min-height:32px;margin-bottom:8px;text-align:center}
.timeline-group-rail{height:14px;display:flex;align-items:center;margin-bottom:8px}
.timeline-group-events{display:flex;flex-direction:column;gap:8px}
.timeline-group .timeline-event{width:100%;min-width:0;flex:auto;padding:0}
.timeline-group .timeline-date,.timeline-group .timeline-rail{display:none}
.timeline-group .timeline-card{min-height:52px}
.timeline-group .timeline-line{display:none}
.timeline-group .timeline-event-title{font-size:12px}.timeline-group{transition:background .12s,border-color .12s;border:1px dashed transparent;border-radius:8px}.timeline-group.timeline-drop-target{background:rgba(76,217,138,.08);border-color:var(--accent)}.timeline-event[draggable="true"]{cursor:grab}.timeline-event[draggable="true"]:active{cursor:grabbing}
.timeline-parse-help{font-size:11px;color:var(--mute);margin-top:4px;line-height:1.6}
.plot-time-tools{display:grid;grid-template-columns:minmax(130px,1fr) minmax(95px,.7fr);gap:7px;margin-top:8px;max-width:430px}
.plot-time-tools input{min-width:0;width:100%;font-size:13px;padding:7px 8px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.plot-time-actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.plot-time-actions .btn{font-size:12px;padding:6px 9px}
.plot-time-tools-label{font-size:11px;color:var(--mute);display:block;margin-bottom:3px}
@media(max-width:480px){.plot-time-tools{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.timeline-event{flex-basis:132px;width:132px;min-width:132px}}

<body>
<header><button class="wn" id="wn" aria-label="작품 목록 열기"></button><span id="total"></span><span id="saveStatus" class="save-status" role="status" aria-live="polite">자동 저장 켜짐</span><button class="theme-toggle" id="themeToggle" type="button" aria-label="라이트 테마로 전환" title="테마 전환">☼</button><button class="gear" id="gear">설정</button></header>
<div id="appTabs" class="app-tabs" role="tablist" aria-label="작업 탭"></div>
<div id="workspaceSplit" class="workspace-split"><div id="appMainTabbar" class="app-pane-tabbar app-main-tabbar" aria-label="왼쪽 작업 창 탭"></div><main id="main"></main><aside id="appSplitPane" aria-label="다른 작업 탭"></aside></div>
<nav role="tablist">
<button role="tab" data-tab="write">원고</button>
<button role="tab" data-tab="chars">인물</button>
<button role="tab" data-tab="world">세계관</button>
<button role="tab" data-tab="plot">플롯</button>
<button role="tab" data-tab="wideas">아이디어</button>
</nav>
<script>
var KEY='storylab-v1';
function newWork(n){return {id:uid(),name:n,chapters:[{id:1,title:'1장',body:''}],chars:[],plots:[],cur:1};}
var R={works:[],w:null,tab:'write'};
try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);
 if(o.works){R=o;}else{o.id=uid();o.name='내 첫 작품';R={works:[o],w:o.id,tab:o.tab||'write'};}}}catch(e){}
if(!R.works.length){R.works.push(newWork('내 첫 작품'));}
if(!R.ideas)R.ideas=[];
if(!R.ideaTrash)R.ideaTrash=[];
if(!Array.isArray(R.ideaTags)||!R.ideaTags.length)R.ideaTags=['소재','장면','대사','설정','기타'];
var IDEA_TRASH=false,IDEA_BOARD=false,IDEA_TAGS_MANAGE=false;
var S;
var PAL=['#1f6f78','#b4483f','#7a4fa3','#2f6fb0','#a06a10','#3a7d44','#c2487b','#5d6b73'],PN=['청록','빨강','보라','파랑','황토','초록','분홍','회색'];
function pick(){S=R.works.find(function(x){return x.id===R.w;})||R.works[0];R.w=S.id;
  if(!S.folders)S.folders=[];
  if(!S.ideas)S.ideas=[];
  if(!S.trash)S.trash=[];
  if(!Array.isArray(S.world))S.world=[];
  if(!Array.isArray(S.relations))S.relations=[];
  if(!Array.isArray(S.openTabs))S.openTabs=[];
  S.openTabs=S.openTabs.filter(function(id){return S.chapters.some(function(c){return c.id===id;});});
  if(S.chapters.some(function(c){return c.id===S.cur;})&&S.openTabs.indexOf(S.cur)<0&&S.openTabs.length===0)S.openTabs.push(S.cur);
  TRASH=false;
  if(!S.psets||!S.psets.length)S.psets=[{id:uid(),name:'메인 플롯'}];
  S.plots.forEach(function(p){if(!p.set)p.set=S.psets[0].id;});
  if(!S.psets.some(function(x){return x.id===S.pcur;}))S.pcur=S.psets[0].id;
  S.chars.forEach(function(c,i){if(!c.color)c.color=PAL[i%PAL.length];});
  S.chars.forEach(function(c){if(!c.tags)c.tags=(c.role||'').split(/[,，、]/).map(function(t){return t.trim();}).filter(Boolean);});
}
pick();R.tab='home';
var armed=null,armT=null;
var saveStatusTimer=null;
var LAST_SAVED_CHAPTER_SNAP=null, PANE_CONFLICT_PENDING=false, PANE_REMOTE_UPDATE=false;
var UNDO_STACK=[],REDO_STACK=[],HISTORY_LIMIT=40,HISTORY_BASELINE='',HISTORY_CHECKPOINT='',HISTORY_LAST_AT=0,HISTORY_APPLYING=false;
var VERSION_KEY=KEY+'-versions',VERSION_LIMIT=25,SPLIT_MODE=false,FILE_REV_TIMER=null,REVISION_PANEL_OPEN=false,COMPARE_REVISION_ID=null,SPLIT_REFERENCE_ID=null;
function stateString(){return JSON.stringify(R);}
function getVersions(){try{return JSON.parse(localStorage.getItem(VERSION_KEY)||'[]');}catch(e){return [];}}
function makeVersion(label,force){var now=Date.now(),arr=getVersions(),snap={id:now+'-'+Math.floor(Math.random()*1000),time:now,label:label||'자동 저장 지점',data:stateString()};if(!force&&arr.length&&now-arr[arr.length-1].time<5*60*1000)return;arr.push(snap);if(arr.length>VERSION_LIMIT)arr=arr.slice(-VERSION_LIMIT);try{localStorage.setItem(VERSION_KEY,JSON.stringify(arr));}catch(e){showSaveStatus('error','버전 기록 저장 실패');}}
function makeChapterRevision(ch,label,force){
  if(!ch)return false;
  if(!Array.isArray(ch.revisions))ch.revisions=[];
  var snap={id:String(Date.now())+'-'+Math.floor(Math.random()*100000),time:Date.now(),label:label||'원고 기록',title:ch.title||'',body:ch.body||'',memo:ch.memo||''};
  var last=ch.revisions[ch.revisions.length-1];
  if(!force&&last&&last.title===snap.title&&last.body===snap.body&&last.memo===snap.memo)return false;
  ch.revisions.push(snap);if(ch.revisions.length>12)ch.revisions=ch.revisions.slice(-12);
  return true;
}
function scheduleChapterRevision(ch){
  clearTimeout(FILE_REV_TIMER);
  FILE_REV_TIMER=setTimeout(function(){if(makeChapterRevision(ch,'자동 기록',false)){save();if(REVISION_PANEL_OPEN&&cur().id===ch.id)paintChapterHistory(ch);}},30000);
}
function revisionLinesHtml(text,other,kind){
  var lines=String(text||'').split('\n');
  return lines.map(function(line){var changed=!!line.trim()&&other.indexOf(line)<0;return '<div class="revision-line '+(changed?kind:'')+'">'+(line?esc(line):'&nbsp;')+'</div>';}).join('');
}
function paintChapterHistory(ch){
  var panel=$('#chapterHistoryPanel');if(!panel||!ch)return;
  var arr=Array.isArray(ch.revisions)?ch.revisions.slice().reverse():[];
  if(!arr.length){panel.innerHTML='<p class="setting-help">이 원고의 이전 기록이 아직 없어요. 지금 기록을 남기면 이후 원고와 나란히 비교할 수 있어요.</p>';}
  else{
    var selected=arr.find(function(v){return String(v.id)===String(COMPARE_REVISION_ID);})||arr[0];COMPARE_REVISION_ID=selected.id;
    panel.innerHTML='<p class="setting-help">이 기록은 현재 원고와 별도로 보관됩니다. 이전 기록을 선택하고 비교하면 두 버전을 나란히 확인할 수 있어요. 기록은 원고 파일마다 최대 12개 보관됩니다.</p><div class="chapter-history-controls"><select id="revisionSelect" aria-label="비교할 이전 원고 기록">'+arr.map(function(v){return '<option value="'+esc(v.id)+'" '+(String(v.id)===String(selected.id)?'selected':'')+'>'+esc(v.label||'원고 기록')+' · '+esc(new Date(v.time).toLocaleString())+'</option>';}).join('')+'</select><button class="btn" id="compareRevision">현재 원고와 비교</button></div><div id="revisionCompare"></div>';
    $('#revisionSelect').onchange=function(){COMPARE_REVISION_ID=this.value;};
    $('#compareRevision').onclick=function(){var v=(ch.revisions||[]).find(function(x){return String(x.id)===String($('#revisionSelect').value);});if(!v)return;COMPARE_REVISION_ID=v.id;var oldLines=String(v.body||'').split('\n'),newLines=String(ch.body||'').split('\n');$('#revisionCompare').innerHTML='<div class="revision-compare-grid"><section class="revision-column"><h4>이전 기록 · '+esc(v.title||'제목 없음')+'<div class="ms">'+esc(new Date(v.time).toLocaleString())+'</div></h4><div class="revision-text">'+revisionLinesHtml(v.body,newLines,'removed')+'</div></section><section class="revision-column"><h4>현재 원고 · '+esc(ch.title||'제목 없음')+'<div class="ms">지금 저장된 내용</div></h4><div class="revision-text">'+revisionLinesHtml(ch.body,oldLines,'added')+'</div></section></div><p class="setting-help">초록색은 현재 원고에만 있는 줄, 붉은색은 이전 기록에만 있는 줄입니다. 비교 결과를 보고 어떤 버전을 유지할지 직접 결정할 수 있어요.</p>';};
  }
}
function restoreState(serialized){try{var o=JSON.parse(serialized);if(!o||!Array.isArray(o.works))return false;R=o;if(!R.ideas)R.ideas=[];if(!R.ideaTrash)R.ideaTrash=[];if(!R.ideaTags)R.ideaTags=['소재','장면','대사','설정','기타'];pick();HISTORY_APPLYING=true;localStorage.setItem(KEY,JSON.stringify(R));HISTORY_BASELINE=stateString();HISTORY_CHECKPOINT=HISTORY_BASELINE;HISTORY_LAST_AT=Date.now();HISTORY_APPLYING=false;return true;}catch(e){HISTORY_APPLYING=false;return false;}}
function undoAction(redo){var from=redo?REDO_STACK:UNDO_STACK,to=redo?UNDO_STACK:REDO_STACK;if(!from.length){showSaveStatus('ready',redo?'다시 실행할 내용이 없어요':'되돌릴 내용이 없어요');return;}to.push(stateString());if(to.length>HISTORY_LIMIT)to.shift();var prev=from.pop();if(restoreState(prev)){showSaveStatus('saved',redo?'다시 실행했어요':'실행 취소했어요');render();}}

function save(){

      try{latest=JSON.parse(localStorage.getItem(KEY)||'null');}catch(ignore){}
      var liveChapter=cur();
      if(latest&&Array.isArray(latest.works)&&liveChapter){
        var remoteChapter=findStoredChapter(latest,R.w,liveChapter.id);
        var localSnap=chapterSnapshot(liveChapter);
        var remoteSnap=chapterSnapshot(remoteChapter);
        var baseSnap=LAST_SAVED_CHAPTER_SNAP;

          return false;

          if(remoteChapter&&localSnap===baseSnap){
            // No local edits since the last save: adopt the newest copy.
            var adopted=JSON.parse(JSON.stringify(remoteChapter));
            var ix=latestWork.chapters.findIndex(function(ch){return String(ch.id)===String(liveChapter.id);});
            if(ix>=0)latestWork.chapters[ix]=adopted;
            Object.keys(liveChapter).forEach(function(k){delete liveChapter[k];});
            Object.assign(liveChapter,adopted);

}

  ed.scrollTop=Math.max(0,h-ed.clientHeight/2);ed.setSelectionRange(pos,pos+len);

function jump(w,tab,cid){R.w=w.id;pick();if(cid){S.cur=cid;EDIT=true;S.openTabs=S.openTabs||[];if(S.openTabs.indexOf(cid)<0)S.openTabs.push(cid);}else if(tab==='write')EDIT=false;R.tab=tab;save();render();}
function hl(t,q,i){
  var s=Math.max(0,i-20),e=Math.min(t.length,i+q.length+50);
  function c(x){return esc(x.replace(/\s+/g,' '));}
  return (s?'…':'')+c(t.slice(s,i))+'<mark>'+c(t.slice(i,i+q.length))+'</mark>'+c(t.slice(i+q.length,e))+(e<t.length?'…':'');
}
function search(q){
  var L=q.toLowerCase(),out=[],seenResults=Object.create(null);
  function add(k,loc,fields,go){fields.forEach(function(f,fi){if(!f)return;var lo=String(f).toLowerCase(),i=lo.indexOf(L);if(i<0)return;while(i>=0&&out.length<500){var normalized=String(f).replace(/\s+/g,' ').trim().toLowerCase();var key=[k,String(loc).replace(/\s+/g,' ').trim().toLowerCase(),normalized].join('\u0001');if(!seenResults[key]){seenResults[key]=true;(function(p,fieldIndex,fieldText){out.push({k:k,loc:loc,text:fieldText,pos:p,go:function(){go(p,L.length,fieldIndex);}});})(i,fi,f);}i=lo.indexOf(L,i+Math.max(1,L.length));}});}
  R.works.forEach(function(w){
    add('작품',w.name,[w.name],function(){jump(w,'write');});
    w.chapters.forEach(function(c){add('원고',w.name+', '+(c.title||'제목 없음'),[c.title,c.body],function(p,l,fi){if(fi===1)REV={pos:p,len:l};jump(w,'write',c.id);});add('메모',w.name+', '+(c.title||'제목 없음'),[c.memo],function(){jump(w,'write',c.id);});});
    w.chars.forEach(function(c){add('인물',w.name+', '+(c.name||'이름 없음'),[c.name,c.tags?c.tags.join(' '):c.role,c.age,c.look,c.trait,c.goal,c.secret,c.voice,c.rel,c.desc],function(){CID=c.id;jump(w,'chars');});});
    w.plots.forEach(function(p){add('플롯',w.name+', '+(((w.psets||[]).find(function(s){return s.id===p.set;})||{}).name||'플롯'),[p.title,p.note,p.storyTime,(p.chars||[]).map(function(id){var c=w.chars.find(function(x){return x.id===id;});return c?c.name:'';}).join(' ')],function(){if(p.set)w.pcur=p.set;jump(w,'plot');});});
    (w.world||[]).forEach(function(x){add('세계관',w.name+', '+(x.type||'기타')+' · '+(x.title||'제목 없음'),[x.title,x.type,x.summary,x.body,x.links],function(){WID=x.id;jump(w,'world');});});
  });
  R.works.forEach(function(w){(w.ideas||[]).forEach(function(x){add('아이디어',w.name+', '+x.tag,[x.title,x.text],function(){R.tf='';jump(w,'wideas');});});});
  R.ideas.forEach(function(x){add('아이디어',x.tag,[x.title,x.text],function(){R.tab='ideas';R.tf='';save();render();});});
  return out;
}
function showSearch(){
  var q=Q.trim(),res=$('#res'),hm=$('#hm');hm.hidden=!!q;
  if(!q){res.innerHTML='';return;}
  var out=search(q);
  res.innerHTML=out.length?'<div class="sec">검색 결과 '+out.length+'곳'+(out.length>200?' (앞의 200곳만 표시)':'')+'</div>'+out.slice(0,200).map(function(o,i){return '<button class="res" data-i="'+i+'"><span class="rk">'+o.k+'</span><span class="rl">'+esc(o.loc)+'</span><span class="rs">'+hl(o.text,q,o.pos)+'</span></button>';}).join(''):'<div class="empty">“'+esc(q)+'” 검색 결과가 없어요.<br>다른 단어로 다시 찾아보세요.</div>';

}

function workProgressHtml(w){

  var chapters=w.chapters||[],plots=w.plots||[],total=0,goal=0,written=0,linked=0;
  chapters.forEach(function(c){var n=cnt(c.body||'');total+=n;if((c.body||'').trim())written++;goal+=c.wordGoal==null?1000:Math.max(0,parseInt(c.wordGoal,10)||0);});

function dragSort(root,sel,key,horiz,handle,extra,onDrop){

        tgt=t;
      }
      function up(){
        document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
        if(!on)return;
        el.classList.remove('dragging');el.style.transform='';el.style.pointerEvents='';document.body.classList.remove('dragmode');clr();
        var sup=function(c){c.stopPropagation();c.preventDefault();};
        window.addEventListener('click',sup,true);setTimeout(function(){window.removeEventListener('click',sup,true);},0);

    });
  });
}

function parseStoryDateTime(raw){
  var v=String(raw||'').trim();if(!v)return null;

    m=v.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일?/);
    if(!m)m=v.match(/(?:^|\D)(\d{1,2})[-/.](\d{1,2})(?:\D|$)/);
    if(m){month=+m[1];day=+m[2];}
  }
  var tm=v.match(/(오전|오후|저녁|밤|새벽|아침)?\s*(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분?)?/);
  if(tm){hasTime=true;hour=+tm[2];minute=+(tm[3]||0);var ap=tm[1];if(ap==='오후'||ap==='저녁'||ap==='밤'){if(hour<12)hour+=12;}else if((ap==='오전'||ap==='새벽')&&hour===12)hour=0;}
  else{
    tm=v.match(/(?:^|\s)(오전|오후|저녁|밤|새벽|아침)?\s*(\d{1,2}):(\d{2})(?:\s|$)/);
    if(tm){hasTime=true;hour=+tm[2];minute=+tm[3];var ap2=tm[1];if(ap2==='오후'||ap2==='저녁'||ap2==='밤'){if(hour<12)hour+=12;}else if((ap2==='오전'||ap2==='새벽')&&hour===12)hour=0;}
  }
  if(month===null||day===null||month<1||month>12||day<1||day>31)return null;
  if(year!==null&&new Date(year,month-1,day).getMonth()!==month-1)return null;
  if(hasTime&&(hour<0||hour>23||minute<0||minute>59))return null;
  var key=(year===null?'0000':String(year).padStart(4,'0'))+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0')+(hasTime?'T'+String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0'):'');

  return {key:key,sort:sort,label:label};
}

  events.forEach(function(p,idx){var dt=parseStoryDateTime(p.storyTime);if(!dt){unknown.push({p:p,idx:idx});return;}var g=groups.find(function(x){return x.key===dt.key;});if(!g){g={key:dt.key,sort:dt.sort,label:dt.label,items:[]};groups.push(g);}g.items.push(p);});
  groups.sort(function(a,b){return a.sort-b.sort;});
  var html='';
  groups.forEach(function(g){html+='<div class="timeline-group" data-group="'+esc(g.key)+'"><div class="timeline-group-date">'+esc(g.label)+'</div><div class="timeline-group-rail"><span class="timeline-dot"></span><span class="timeline-line"></span></div><div class="timeline-group-events">'+g.items.map(timelineCardHtml).join('')+'</div></div>';});
  if(unknown.length)html+='<div class="timeline-group unknown-group"><div class="timeline-group-date">날짜·시간 미인식</div><div class="timeline-group-rail"><span class="timeline-dot"></span><span class="timeline-line"></span></div><div class="timeline-group-events">'+unknown.map(function(x){return timelineCardHtml(x.p);}).join('')+'</div></div>';
  return html;
}

window.addEventListener('storage',function(ev){
  if(ev.key!==KEY||!ev.newValue||PANE_REMOTE_UPDATE)return;
  var incoming;
  try{incoming=JSON.parse(ev.newValue);}catch(ignore){return;}
  if(!incoming||!Array.isArray(incoming.works))return;
  var live=R.tab==='write'&&EDIT&&S?cur():null;
  var localSnap=chapterSnapshot(live);
  var baseSnap=LAST_SAVED_CHAPTER_SNAP;
  var remote=live?findStoredChapter(incoming,R.w,live.id):null;
  var remoteSnap=chapterSnapshot(remote);
  var localDirty=!!(live&&baseSnap&&localSnap!==baseSnap);
  var remoteChanged=!!(remote&&baseSnap&&remoteSnap!==baseSnap);
  if(localDirty&&remoteChanged&&localSnap!==remoteSnap){
    if(!PANE_CONFLICT_PENDING){
      PANE_CONFLICT_PENDING=true;
      var keepLocal=confirm('같은 원고가 다른 작업 화면에서도 수정됐어요.\n\n[확인] 이 화면의 수정 내용을 유지하고 저장\n[취소] 다른 화면에 저장된 내용을 불러오기\n\n선택하지 않은 쪽의 수정 내용은 원고 기록을 통해 확인할 수 있어요.');
      if(keepLocal){
        // Mark the remote version as the comparison baseline, then save the user's explicit choice.
        LAST_SAVED_CHAPTER_SNAP=remoteSnap;
        PANE_CONFLICT_PENDING=false;
        showSaveStatus('conflict','충돌 확인 · 이 화면의 수정 내용 저장 중');
        setTimeout(function(){save();},0);
      }else{
        var fresh=JSON.parse(JSON.stringify(remote));
        Object.keys(live).forEach(function(k){delete live[k];});
        Object.assign(live,fresh);
        LAST_SAVED_CHAPTER_SNAP=remoteSnap;
        PANE_CONFLICT_PENDING=false;
        var editor=document.getElementById('ed'),memo=document.getElementById('memo'),title=document.getElementById('ct');
        if(editor)editor.value=fresh.body||'';
        if(memo)memo.value=fresh.memo||'';
        if(title)title.value=fresh.title||'';
        if(typeof updateStats==='function')updateStats();
        if(typeof updTotal==='function')updTotal();
        showSaveStatus('saved','다른 화면의 내용 불러옴');
      }
    }
    return;
  }
  try{
    var oldTab=R.tab,oldWork=R.w,oldEdit=EDIT,oldCur=S&&S.cur;
    var preserved=null;
    if(localDirty&&live)preserved=JSON.parse(JSON.stringify(live));
    R=incoming;
    if(!R.ideas)R.ideas=[];
    if(!R.ideaTrash)R.ideaTrash=[];
    if(!Array.isArray(R.ideaTags)||!R.ideaTags.length)R.ideaTags=['소재','장면','대사','설정','기타'];
    if(preserved){
      var work=R.works.find(function(w){return String(w.id)===String(S.id);});
      var chapter=work&&work.chapters.find(function(c){return String(c.id)===String(preserved.id);});
      if(work){if(chapter){var ix=work.chapters.indexOf(chapter);work.chapters[ix]=preserved;}else work.chapters.push(preserved);}
    }
    if(typeof APP_PANE_MODE!=='undefined'&&APP_PANE_MODE&&APP_PANE_SCREEN){
      R.w=APP_PANE_SCREEN.workId!=null?APP_PANE_SCREEN.workId:R.w;
      pick();R.tab=APP_PANE_SCREEN.tab||'home';EDIT=!!APP_PANE_SCREEN.edit;
      if(APP_PANE_SCREEN.cur!=null&&S.chapters.some(function(c){return String(c.id)===String(APP_PANE_SCREEN.cur);}))S.cur=APP_PANE_SCREEN.cur;
    }else{
      R.w=oldWork;pick();R.tab=oldTab;EDIT=oldEdit;
      if(oldCur!=null&&S.chapters.some(function(c){return String(c.id)===String(oldCur);}))S.cur=oldCur;
    }
    if(!preserved&&live){
      var fresh=cur();LAST_SAVED_CHAPTER_SNAP=chapterSnapshot(fresh);
      var editor=document.getElementById('ed'),memo=document.getElementById('memo'),title=document.getElementById('ct');
      if(editor&&fresh&&document.activeElement!==editor)editor.value=fresh.body||'';
      if(memo&&fresh&&document.activeElement!==memo)memo.value=fresh.memo||'';
      if(title&&fresh&&document.activeElement!==title)title.value=fresh.title||'';
      if(typeof updateStats==='function')updateStats();
      if(typeof updTotal==='function')updTotal();
      showSaveStatus('saved','다른 화면의 변경 사항 동기화됨');
      clearTimeout(saveStatusTimer);
      saveStatusTimer=setTimeout(function(){if(!PANE_CONFLICT_PENDING)showSaveStatus('ready','자동 저장 켜짐');},1800);
    }
  }catch(syncError){console.warn('다른 화면의 저장 내용 동기화 실패:',syncError);}
});
try{
 var paneHash=window.__STORY_PANE_SCREEN?'#story-pane='+encodeURIComponent(JSON.stringify(window.__STORY_PANE_SCREEN)):(location.hash||'');if(!paneHash&&window.name.indexOf('story-pane=')===0)paneHash='#'+window.name;
 if(paneHash.indexOf('#story-pane=')===0){
   APP_PANE_MODE=true;document.body.classList.add('app-pane-mode');
   APP_PANE_SCREEN=JSON.parse(decodeURIComponent(paneHash.slice('#story-pane='.length)));
   if(APP_PANE_SCREEN&&APP_PANE_SCREEN.workId!=null)R.w=APP_PANE_SCREEN.workId;
   pick();
   if(APP_PANE_SCREEN){R.tab=APP_PANE_SCREEN.tab||'home';EDIT=!!APP_PANE_SCREEN.edit;if(APP_PANE_SCREEN.cur!=null&&S.chapters.some(function(c){return String(c.id)===String(APP_PANE_SCREEN.cur);}))S.cur=APP_PANE_SCREEN.cur;}
 }
}catch(e){}
render();

(function(){
 var key="storylab-ui-theme";
 function applyTheme(value){
  var theme=value==="light"?"light":"dark";
  document.documentElement.setAttribute("data-theme",theme);
  document.documentElement.style.colorScheme=theme;
  document.querySelectorAll("#appSplitPane iframe.app-live-pane").forEach(function(frame){try{if(frame.contentDocument){frame.contentDocument.documentElement.setAttribute("data-theme",theme);frame.contentDocument.documentElement.style.colorScheme=theme;}}catch(e){}});
  var button=document.getElementById("themeToggle");
  if(button){button.textContent=theme==="dark"?"☼":"☾";button.setAttribute("aria-label",theme==="dark"?"라이트 테마로 전환":"다크 테마로 전환");button.title=theme==="dark"?"라이트 테마":"다크 테마";}
 }
 var initial="dark";
 try{initial=localStorage.getItem(key)||"dark";}catch(e){}
 applyTheme(initial);
 window.addEventListener("storage",function(ev){if(ev.key===key&&ev.newValue)applyTheme(ev.newValue);});
 document.addEventListener("DOMContentLoaded",function(){
  var button=document.getElementById("themeToggle");
  if(button)button.addEventListener("click",function(){
   var next=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
   applyTheme(next);try{localStorage.setItem(key,next);}catch(e){}
  });
 });
})();

</script>
